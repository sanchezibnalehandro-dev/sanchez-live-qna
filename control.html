<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Q&A Control</title>
  <link rel="stylesheet" href="./theme.css" />
</head>
<body>
  <div class="app">
    <main class="shell" style="max-width:980px;">
      <section class="card" id="gateCard">
        <div class="card-inner stack" style="max-width:520px; margin:0 auto;">
          <div class="eyebrow"><span class="live-dot"></span><span>CONTROL ACCESS</span></div>
          <h1>Вход в Q&A Control</h1>
          <p class="subcopy">Лёгкий вход для управления комнатой и открытия рабочих окон.</p>
          <input class="input" id="passwordInput" type="password" placeholder="Введите пароль" />
          <div class="row"><button class="btn primary" id="enterBtn">Войти</button></div>
          <div class="status" id="gateStatus"></div>
        </div>
      </section>

      <div id="hub" hidden>
        <section class="card"><div class="card-inner hero-grid">
          <div>
            <div class="eyebrow"><span class="live-dot"></span><span id="roomLabel">CONTROL ROOM</span></div>
            <h1>Q&A Control Hub</h1>
            <p class="subcopy">Открой нужное окно и быстро посмотри, что происходит в комнате.</p>
          </div>
          <div class="links-grid">
            <div class="link-box"><div class="link-label">Статус комнаты</div><div class="link-value" id="roomStatus">Загрузка…</div></div>
            <div class="link-box"><div class="link-label">Активный спикер</div><div class="link-value" id="speakerStatus">Загрузка…</div></div>
          </div>
        </div></section>

        <section class="grid-2">
          <div class="stack">
            <section class="card"><div class="card-inner stack">
              <h2 class="section-title">Рабочие окна</h2>
              <div class="row">
                <button class="btn primary" id="openAdminBtn">Открыть admin</button>
                <button class="btn ghost" id="openModBtn">Открыть moderator</button>
                <button class="btn ghost" id="openAskBtn">Открыть guest</button>
              </div>
              <div class="row">
                <button class="btn danger" id="logoutBtn">Выйти</button>
              </div>
            </div></section>
          </div>
          <section class="card"><div class="card-inner">
            <h2 class="section-title">Последние вопросы</h2>
            <div class="list" id="latestQuestions"></div>
          </div></section>
        </section>
      </div>
    </main>
  </div>

  <script type="module">
    import { getRoomSlug, getRoomBySlug, getActiveSpeaker, listQuestions, subscribeRoom, escapeHtml, formatClock } from './supabase-qna.js';

    const roomSlug = getRoomSlug();
    const PASSWORD = 'altera-qna-2026';
    const STORAGE_KEY = `control-pass:${roomSlug}`;

    const gateCard = document.getElementById('gateCard');
    const hub = document.getElementById('hub');
    const gateStatus = document.getElementById('gateStatus');
    const roomLabel = document.getElementById('roomLabel');
    const roomStatus = document.getElementById('roomStatus');
    const speakerStatus = document.getElementById('speakerStatus');
    const latestQuestions = document.getElementById('latestQuestions');

    let room = null;
    let speaker = null;
    let questions = [];
    let unsubscribe = null;

    document.getElementById('enterBtn').addEventListener('click', enter);
    document.getElementById('logoutBtn').addEventListener('click', () => {
      sessionStorage.removeItem(STORAGE_KEY);
      location.reload();
    });
    document.getElementById('openAdminBtn').addEventListener('click', () => window.open(`./admin.html?room=${roomSlug}`, '_blank', 'noopener'));
    document.getElementById('openModBtn').addEventListener('click', () => window.open(`./mod.html?room=${roomSlug}`, '_blank', 'noopener'));
    document.getElementById('openAskBtn').addEventListener('click', () => window.open(`./ask.html?room=${roomSlug}`, '_blank', 'noopener'));

    if (sessionStorage.getItem(STORAGE_KEY) === 'ok') startHub();

    function enter() {
      const value = document.getElementById('passwordInput').value;
      if (value !== PASSWORD) {
        gateStatus.textContent = 'Неверный пароль.';
        gateStatus.className = 'status error';
        return;
      }
      sessionStorage.setItem(STORAGE_KEY, 'ok');
      startHub();
    }

    async function startHub() {
      gateCard.hidden = true;
      hub.hidden = false;
      roomLabel.textContent = `CONTROL ROOM · ${roomSlug}`;
      await refresh();
      if (unsubscribe) unsubscribe();
      unsubscribe = subscribeRoom(room.id, refresh);
    }

    async function refresh() {
      room = await getRoomBySlug(roomSlug);
      speaker = await getActiveSpeaker(room.id);
      questions = await listQuestions(room.id, null, { includeHidden: true, includeAsked: true });
      roomStatus.textContent = room?.is_questions_open ? 'Приём открыт' : 'Приём закрыт';
      speakerStatus.textContent = speaker?.name || room?.fallback_label || 'Не выбран';
      renderQuestions();
    }

    function renderQuestions() {
      if (!questions.length) {
        latestQuestions.innerHTML = '<div class="empty">Пока вопросов нет.</div>';
        return;
      }
      latestQuestions.innerHTML = questions.slice(0, 10).map((item) => `
        <div class="question-card">
          <div class="row" style="justify-content:space-between; align-items:flex-start;">
            <div class="question-text">${escapeHtml(item.text)}</div>
            <span class="badge ${item.status === 'asked' ? 'asked' : item.status === 'hidden' ? 'hidden' : 'open'}">${item.status}</span>
          </div>
          <div class="question-meta">${formatClock(item.created_at)} · +1: ${item.votes_count || 0}</div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
