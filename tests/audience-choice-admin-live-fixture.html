<!doctype html><html lang="ru"><head><meta charset="utf-8"></head><body>
<section id="panel" hidden>
<strong data-poll-status>—</strong>
<button type="button" data-poll-open>Open</button>
<button type="button" data-poll-close>Close</button>
<button type="button" data-poll-refresh>Refresh</button>
<div data-poll-counts></div><div data-poll-winner></div><div data-poll-message></div>
</section>
<script type="module">
import { mountAudienceChoiceAdmin } from '../audience-choice-admin.mjs';
const cfg=window.__AUDIENCE_LOCAL_CI;
const supabase={rpc:async(name,args)=>{
  try {
    const response=await fetch(cfg.api+'/rest/v1/rpc/'+name,{
      method:'POST',
      headers:{apikey:cfg.anon,authorization:'Bearer '+cfg.token,'content-type':'application/json'},
      body:JSON.stringify(args)
    });
    const data=await response.json();
    return response.ok?{data,error:null}:{data:null,error:data};
  }catch(error){return {data:null,error};}
}};
void mountAudienceChoiceAdmin(document.getElementById('panel'),supabase,'elina-28-rehearsal');
</script></body></html>
