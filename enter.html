<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Q&A Access</title>
  <link rel="stylesheet" href="./theme.css" />
</head>
<body>
  <div class="app">
    <main class="shell" style="max-width:620px;">
      <section class="card">
        <div class="card-inner stack">
          <div class="eyebrow"><span class="live-dot"></span><span>ACCESS GATE</span></div>
          <h1>Вход в админку</h1>
          <p class="subcopy">Сначала пароль. После успешного входа сразу открывается `admin-pro` для нужной комнаты.</p>
          <input class="input" id="passwordInput" type="password" placeholder="Введите пароль" />
          <div class="row"><button class="btn primary" id="enterBtn">Открыть admin-pro</button></div>
          <div class="status" id="status"></div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const room = (params.get('room') || 'altera-forum').trim() || 'altera-forum';
    const PASSWORD = 'altera-qna-2026';
    const STORAGE_KEY = `qna-enter:${room}`;

    const input = document.getElementById('passwordInput');
    const button = document.getElementById('enterBtn');
    const statusEl = document.getElementById('status');

    if (sessionStorage.getItem(STORAGE_KEY) === 'ok') {
      location.href = `./admin-pro.html?room=${encodeURIComponent(room)}`;
    }

    button.addEventListener('click', go);
    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') go();
    });

    function go() {
      if (input.value !== PASSWORD) {
        statusEl.textContent = 'Неверный пароль.';
        statusEl.className = 'status error';
        return;
      }
      sessionStorage.setItem(STORAGE_KEY, 'ok');
      location.href = `./admin-pro.html?room=${encodeURIComponent(room)}`;
    }
  </script>
</body>
</html>
