<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Altera Q&A Live</title>
  <link rel="stylesheet" href="./theme.css" />
</head>
<body>
  <div class="app">
    <main class="shell" style="max-width:860px;">
      <section class="card">
        <div class="card-inner">
          <div class="eyebrow"><span class="live-dot"></span><span>ALATERA Q&A LIVE</span></div>
          <h1>Вопросы спикеру</h1>
          <p class="subcopy">Стартовая страница проекта. Отсюда можно открыть гостевую страницу, модераторскую панель и админку для комнаты <strong>altera-forum</strong>.</p>
        </div>
      </section>

      <section class="card">
        <div class="card-inner stack">
          <h2 class="section-title">Быстрый вход</h2>
          <div class="row">
            <a class="btn primary" href="./ask.html?room=altera-forum">Открыть guest</a>
            <a class="btn ghost" href="./mod.html?room=altera-forum">Открыть moderator</a>
            <a class="btn ghost" href="./admin.html?room=altera-forum">Открыть admin</a>
          </div>
          <div class="muted">Если потом понадобится другая room, просто меняем параметр <code>?room=...</code>.</div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
