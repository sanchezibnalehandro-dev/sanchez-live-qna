<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title></title>
  <link rel="stylesheet" href="./theme.css" />
  <link rel="stylesheet" data-brand-stylesheet />
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const room = (params.get('room') || '').trim();
      const event = (params.get('event') || '').trim();
      const isTasigo = room.startsWith('tasigo-esg-') || event.startsWith('tasigo-esg-');
      document.querySelector('[data-brand-stylesheet]').href = isTasigo ? './brands/tasigo-esg.css' : './brands/sanchez.css';
    })();
  </script>
  <style>
    .login-network-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .login-network-vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(
        ellipse at 50% 36%,
        color-mix(in srgb, var(--color-bg) 54%, transparent) 0%,
        color-mix(in srgb, var(--color-bg) 28%, transparent) 42%,
        transparent 80%
      );
    }
    .login-page .app { z-index: 2; }
    @media (prefers-reduced-motion: reduce) {
      .login-network-bg { opacity: .88; }
    }
  </style>
</head>
<body class="login-page">
  <canvas class="login-network-bg" id="loginNetworkBackground" aria-hidden="true"></canvas>
  <div class="login-network-vignette" aria-hidden="true"></div>
  <div class="app">
    <main class="shell" style="max-width:480px; padding-top: clamp(32px, 8vh, 80px);">
      <section class="card">
        <div class="card-inner stack" style="gap:18px; padding: 28px;">

          <div class="brand-logo">
            <div class="brand-logo-mark" data-brand-mark></div>
            <span class="brand-logo-text"><span data-brand-name></span> · <span data-brand-product></span></span>
          </div>

          <div>
            <h1 style="font-size: clamp(22px, 4vw, 32px);">Вход в систему</h1>
            <p class="subcopy" style="margin-top:8px;">Доступ для модераторов и администраторов мероприятия.</p>
          </div>

          <div class="stack" style="gap:10px;">
            <div>
              <label style="display:block; font-size:11px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); margin-bottom:6px;">Email</label>
              <input class="input" id="emailInput" type="email" placeholder="your@email.com" autocomplete="username" />
            </div>
            <div>
              <label style="display:block; font-size:11px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); margin-bottom:6px;">Пароль</label>
              <input class="input" id="passwordInput" type="password" placeholder="••••••••" autocomplete="current-password" />
            </div>
          </div>

          <button class="btn primary" id="enterBtn" style="width:100%; padding:14px;">Войти</button>
          <div class="status" id="status"></div>

        </div>
      </section>

      <p style="text-align:center; font-size:12px; color:var(--muted-2); margin-top:12px;">
        Гостевая страница для вопросов доступна по QR-коду
      </p>
    </main>
  </div>

  <script type="module">
    import { applyBrandIdentity, getBrandForRoute } from './brand.js';
    import { initLoginNetworkBackground } from './login-background.js';
    import { supabase, getRoomSlug, getEventKey, getCurrentEventRoom, listEventRooms } from './supabase-qna.js';

    const room = getRoomSlug();
    const eventKey = getEventKey();
    const params = new URLSearchParams(location.search);
    const next = params.get('next') === 'moderator' ? 'moderator' : 'admin';
    applyBrandIdentity('login', getBrandForRoute(room, eventKey));
    initLoginNetworkBackground(document.getElementById('loginNetworkBackground'));

    async function destinationUrl() {
      if (next === 'moderator') {
        const route = eventKey
          ? `event=${encodeURIComponent(eventKey)}`
          : `room=${encodeURIComponent(room)}`;
        return `./mod-auth.html?${route}`;
      }

      if (eventKey) {
        const currentRoom = await getCurrentEventRoom(eventKey);
        if (currentRoom?.slug) {
          return `./admin-auth.html?room=${encodeURIComponent(currentRoom.slug)}`;
        }

        const eventRooms = await listEventRooms(eventKey);
        if (eventRooms[0]?.slug) {
          return `./admin-auth.html?room=${encodeURIComponent(eventRooms[0].slug)}`;
        }

        const error = new Error('Мероприятие не найдено.');
        error.code = 'EVENT_NOT_FOUND';
        throw error;
      }

      return `./admin-auth.html?room=${encodeURIComponent(room)}`;
    }
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const statusEl = document.getElementById('status');
    const enterBtn = document.getElementById('enterBtn');
    let loggingIn = false;

    boot();
    enterBtn.addEventListener('click', login);
    passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
    emailInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') passwordInput.focus(); });

    async function boot() {
      const { data } = await supabase.auth.getSession();
      if (!data.session) return;
      try {
        location.href = await destinationUrl();
      } catch (error) {
        setStatus(error?.code === 'EVENT_NOT_FOUND' ? 'Мероприятие не найдено. Проверьте ссылку.' : (error?.message || 'Не удалось открыть интерфейс.'), 'error');
      }
    }

    async function login() {
      if (loggingIn) return;
      statusEl.textContent = '';
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      if (!email || !password) {
        setStatus('Введите email и пароль.', 'error');
        return;
      }
      loggingIn = true;
      enterBtn.disabled = true;
      enterBtn.textContent = 'Вхожу…';
      try {
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) {
          setStatus(error.message || 'Не удалось войти.', 'error');
          return;
        }
        location.href = await destinationUrl();
      } catch (error) {
        setStatus(error.message || 'Не удалось войти.', 'error');
      } finally {
        loggingIn = false;
        enterBtn.disabled = false;
        enterBtn.textContent = 'Войти';
      }
    }

    function setStatus(message, type = '') {
      statusEl.textContent = message;
      statusEl.className = `status ${type}`.trim();
    }
  </script>
</body>
</html>
