<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title></title>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const room = (params.get('room') || '').trim();
      const event = (params.get('event') || '').trim();
      const isKdw = room.startsWith('kdw-2026-') || event.startsWith('kdw-2026-');
      const isTasigo = room.startsWith('tasigo-esg-') || event.startsWith('tasigo-esg-');
      const isElina = event === 'elina-28-2026' || event === 'elina-28-rehearsal' || room === 'elina-28-session';
      document.documentElement.dataset.brand = isElina ? 'elina-28' : isKdw ? 'kdw-2026' : isTasigo ? 'tasigo-esg' : 'sanchez';
      document.documentElement.classList.toggle('kdw-tiles', event === 'kdw-2026-finokhin');
      document.documentElement.style.backgroundColor = isElina ? '#080d15' : isKdw ? '#041b20' : isTasigo ? '#101612' : '#020810';
      document.documentElement.style.colorScheme = 'dark';
    })();
  </script>
  <link rel="stylesheet" href="./theme.css" />
  <link rel="stylesheet" href="./guest-network-background.css" />
  <link rel="stylesheet" data-brand-stylesheet />
  <script>
    (() => {
      const selectedBrand = document.documentElement.dataset.brand;
      document.querySelector('[data-brand-stylesheet]').href = selectedBrand === 'kdw-2026'
        ? './brands/kdw-2026.css'
        : selectedBrand === 'tasigo-esg' ? './brands/tasigo-esg.css'
        : selectedBrand === 'elina-28' ? './brands/elina-28.css' : './brands/sanchez.css';
    })();
  </script>
  <style>
    .event-entry { min-height: 100vh; display: grid; align-items: start; justify-items: center; padding: max(18px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom)); }
    .event-entry-shell { width: min(620px, 100%); display: grid; gap: 16px; }
    .event-entry-brand { display: flex; align-items: center; gap: 14px; padding: 8px 2px 4px; }
    .event-entry-brand .brand-logo-mark { width: 54px; height: 54px; border-radius: 17px; flex: 0 0 auto; box-shadow: 0 0 24px color-mix(in srgb, var(--color-accent) 22%, transparent); }
    .event-entry-brand-copy { min-width: 0; display: grid; gap: 5px; }
    .event-entry-brand-copy strong { color: var(--color-text); font-family: var(--font-display); font-size: clamp(16px, 4vw, 20px); font-weight: 800; line-height: 1.15; letter-spacing: .01em; }
    .event-entry-brand-copy span { color: var(--color-text-secondary); font-size: 10px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    .event-program { position: relative; overflow: hidden; padding: clamp(22px, 6vw, 34px); display: grid; gap: 0; background: radial-gradient(circle at 92% 6%, color-mix(in srgb, var(--color-accent) 10%, transparent), transparent 38%), var(--color-surface-raised); }
    .event-program-label { color: var(--color-accent-text); font-size: 10px; font-weight: 850; letter-spacing: .2em; text-transform: uppercase; }
    .event-program-time { margin-top: 14px; color: var(--color-text); font-size: clamp(24px, 6vw, 34px); font-weight: 850; line-height: 1; font-variant-numeric: tabular-nums; }
    .event-program-title { margin-top: 17px; color: var(--color-text); font-family: var(--font-display); font-size: clamp(28px, 7vw, 42px); font-weight: 800; line-height: 1.08; letter-spacing: -.03em; overflow-wrap: anywhere; }
    .event-program-type { margin-top: 15px; color: var(--color-text-secondary); font-size: 10px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    .event-entry-actions { display: grid; gap: 10px; margin-top: 26px; }
    .event-entry-action { min-height: 66px; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px 18px; border: 1px solid var(--color-border); border-radius: 18px; text-decoration: none; background: var(--color-surface-subtle); color: var(--color-text); transition: border-color .15s ease, transform .15s ease, background .15s ease; }
    .event-entry-action:hover { border-color: var(--color-border-strong); transform: translateY(-1px); }
    .event-entry-action[hidden] { display: none; }
    .event-entry-action.primary { background: var(--color-accent); color: var(--color-accent-contrast, #fff); border-color: transparent; }
    .event-entry-qna-state { min-height: 66px; display: grid; align-content: center; gap: 4px; padding: 14px 18px; border: 1px solid var(--color-border); border-radius: 18px; background: var(--color-surface-subtle); color: var(--color-text); }
    .event-entry-qna-state[hidden] { display: none; }
    .event-entry-qna-state strong { font-size: 16px; font-weight: 850; }
    .event-entry-qna-state span { color: var(--color-text-secondary); font-size: 12px; line-height: 1.45; }
    .event-entry-action strong { font-size: 16px; font-weight: 850; }
    .event-entry-action .event-entry-arrow { flex: 0 0 auto; font-size: 20px; line-height: 1; }
    .kdw-action-icon { display: none; }
    /* Only the KDW panel uses two square, icon-led actions. Other events retain their existing controls. */
    html.kdw-tiles .event-entry-actions { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    html.kdw-tiles .event-entry-action,
    html.kdw-tiles .event-entry-qna-state {
      position: relative; aspect-ratio: 1 / 1; min-height: 0; min-width: 0;
      padding: clamp(14px, 3vw, 24px); border-radius: 18px;
      display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 12px;
      overflow: hidden;
    }
    html.kdw-tiles .event-entry-action[hidden],
    html.kdw-tiles .event-entry-qna-state[hidden] { display: none; }
    html.kdw-tiles .event-entry-action:not(.primary) {
      background: linear-gradient(145deg, color-mix(in srgb, var(--color-accent) 9%, transparent), transparent 64%), var(--color-surface-raised);
    }
    html.kdw-tiles .event-entry-action .kdw-action-icon,
    html.kdw-tiles .event-entry-qna-state .kdw-action-icon {
      width: clamp(37px, 5vw, 52px); height: clamp(37px, 5vw, 52px);
      display: grid; place-items: center; flex: 0 0 auto;
      border: 1px solid var(--color-accent-border); border-radius: 12px;
      background: var(--color-accent-soft); color: var(--color-accent-text);
    }
    html.kdw-tiles .event-entry-action.primary .kdw-action-icon {
      border-color: rgba(3, 48, 42, .15); background: rgba(3, 48, 42, .1);
      color: var(--color-accent-contrast, #042720);
    }
    html.kdw-tiles .kdw-action-icon svg {
      width: 26px; height: 26px; fill: none; stroke: currentColor;
      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    }
    html.kdw-tiles .event-entry-action strong,
    html.kdw-tiles .event-entry-qna-state strong {
      font-family: var(--font-display); font-size: clamp(15px, 2.6vw, 21px);
      line-height: 1.25; letter-spacing: -.02em; overflow-wrap: anywhere;
    }
    html.kdw-tiles .event-entry-action .event-entry-arrow {
      position: absolute; right: clamp(14px, 3vw, 24px); top: clamp(17px, 3vw, 25px);
      font-size: 21px; opacity: .85;
    }
    html.kdw-tiles .event-entry-qna-state > span:not(.kdw-action-icon) { display: none; }
    html.kdw-tiles .event-entry-qna-state {
      background: var(--color-surface-subtle);
      border-color: var(--color-border-subtle);
    }
    html.kdw-tiles .event-entry-qna-state .kdw-action-icon {
      color: var(--color-text-secondary); border-color: var(--color-border-subtle);
      background: rgba(255,255,255,.04);
    }
    html.kdw-tiles .event-entry-action:focus-visible {
      outline: 3px solid var(--color-focus-ring); outline-offset: 3px;
    }
    @media (max-width: 390px) {
      html.kdw-tiles .event-entry-actions { gap: 9px; }
      html.kdw-tiles .event-entry-action,
      html.kdw-tiles .event-entry-qna-state { padding: 13px; border-radius: 15px; }
      html.kdw-tiles .event-entry-action strong,
      html.kdw-tiles .event-entry-qna-state strong { font-size: 14px; }
      html.kdw-tiles .event-entry-action .kdw-action-icon,
      html.kdw-tiles .event-entry-qna-state .kdw-action-icon { width: 36px; height: 36px; }
      html.kdw-tiles .kdw-action-icon svg { width: 22px; height: 22px; }
      html.kdw-tiles .event-entry-action .event-entry-arrow { top: 14px; right: 13px; font-size: 18px; }
    }
    .event-entry-foot { min-height: 18px; padding: 0 8px; color: var(--color-text-secondary); font-size: 10px; text-align: center; }
    .event-entry-realtime { display: inline-flex; align-items: center; gap: 6px; }
    .event-entry-realtime::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .event-entry-realtime[data-state="offline"] { color: var(--color-danger-text); }
    @media (max-width: 560px) {
      .event-entry { padding-top: max(14px, env(safe-area-inset-top)); }
      .event-entry-shell { gap: 13px; }
      .event-entry-brand { padding-bottom: 2px; }
      .event-entry-brand .brand-logo-mark { width: 50px; height: 50px; border-radius: 16px; }
      .event-program { padding: 22px 20px 20px; }
      .event-program-title { font-size: clamp(27px, 8vw, 34px); }
      .event-entry-action, .event-entry-qna-state { min-height: 62px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .event-entry-action { transition: none; }
      .event-entry-action:hover { transform: none; }
    }
  </style>
</head>
<body class="is-booting">
  <div class="bootstrap-screen" id="bootstrapScreen" role="status" aria-live="polite">
    <div class="bootstrap-card">
      <div class="bootstrap-brand"><div class="brand-logo-mark" data-brand-mark></div><div class="bootstrap-brand-copy"><strong data-brand-name></strong><span data-brand-product></span></div></div>
      <p class="bootstrap-message" id="bootstrapMessage">Загрузка мероприятия…</p>
    </div>
  </div>

  <main class="event-entry app" id="appShell" inert aria-hidden="true">
    <div class="event-entry-shell">
      <header class="event-entry-brand">
        <div class="brand-logo-mark" data-brand-mark></div>
        <div class="event-entry-brand-copy"><strong data-brand-name></strong><span data-brand-product></span></div>
      </header>

      <section class="card event-program" id="programCard" aria-live="polite">
        <div class="event-program-label" id="programLabel"></div>
        <div class="event-program-time" id="programTime"></div>
        <div class="event-program-title" id="programTitle"></div>
        <div class="event-program-type" id="programType" hidden></div>

        <div class="event-entry-actions" id="entryActions">
          <a class="event-entry-action primary" id="askLink" href="#" hidden>
            <span class="kdw-action-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20.5 11.5a8.5 8.5 0 0 1-12.2 7.6L3 21l1.9-5.3a8.5 8.5 0 1 1 15.6-4.2Z"/><path d="M9.5 9.2a2.6 2.6 0 0 1 5.1.8c0 1.6-2.6 2-2.6 3.4"/><path d="M12 16.5h.01"/></svg></span>
            <strong>Задать вопрос</strong>
            <span class="event-entry-arrow" aria-hidden="true">→</span>
          </a>
          <div class="event-entry-qna-state" id="askClosedState" role="status">
            <span class="kdw-action-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="5"/><path d="M12 8v4l3 2"/></svg></span>
            <strong>Q&amp;A пока закрыт</strong>
            <span>Когда Q&amp;A откроется, здесь появится кнопка «Задать вопрос».</span>
          </div>
          <a class="event-entry-action" id="audienceVoteLink" href="#" hidden>
            <strong>Vote · Audience Choice</strong>
            <span class="event-entry-arrow" aria-hidden="true">→</span>
          </a>
          <a class="event-entry-action" id="programLink" href="#">
            <span class="kdw-action-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3.5 20v-1.2a5.5 5.5 0 0 1 11 0V20"/><path d="M16 5.1a3 3 0 0 1 0 5.8M18 14.1a5 5 0 0 1 2.5 4.3V20"/></svg></span>
            <strong>Программа дня</strong>
            <span class="event-entry-arrow" aria-hidden="true">→</span>
          </a>
          <a class="event-entry-action" id="telegramLink" href="https://t.me/+XxDl9Plfr3I2ZjE6" target="_blank" rel="noopener noreferrer" hidden>
            <strong>Telegram мероприятия</strong>
            <span class="event-entry-arrow" aria-hidden="true">↗</span>
          </a>
        </div>
      </section>

      <div class="event-entry-foot">
        <span class="event-entry-realtime" id="realtimeStatus" data-state="connecting" role="status">подключение</span>
      </div>
    </div>
  </main>

  <script type="module">
    import { applyBrandIdentity, getBrandForRoute } from './brand.js';
    import { deriveGuestProgramState, PROGRAM_HERO_STATE } from './guest-program-state.mjs';
    import { getEventKey, loadGuestEventProgram, subscribeGuestEventProgram, supabase } from './supabase-qna.js';
    import { ELINA_28_EVENT_KEYS, voteButtonVisible } from './audience-choice-flow.mjs';

    const eventKey = getEventKey();
    const isEnglishEvent = eventKey === 'elina-28-2026';
    const txt = (ru, en) => isEnglishEvent ? en : ru;
    if (isEnglishEvent) document.documentElement.lang = 'en';
    const audienceVoteEligible = ELINA_28_EVENT_KEYS.includes(eventKey);
    const brand = getBrandForRoute(null, eventKey);
    applyBrandIdentity('welcome', brand);
    void import('./guest-network-background.js')
      .then(({ initGuestNetworkBackground }) => initGuestNetworkBackground('welcome'))
      .catch(error => console.warn('ModeratorLive guest background unavailable', error));

    const appShell = document.getElementById('appShell');
    const bootstrapScreen = document.getElementById('bootstrapScreen');
    const bootstrapMessage = document.getElementById('bootstrapMessage');
    const entryActions = document.getElementById('entryActions');
    const askLink = document.getElementById('askLink');
    const askClosedState = document.getElementById('askClosedState');
    const programLink = document.getElementById('programLink');
    const audienceVoteLink = document.getElementById('audienceVoteLink');
    const telegramLink = document.getElementById('telegramLink');
    const programCard = document.getElementById('programCard');
    const programLabel = document.getElementById('programLabel');
    const programTime = document.getElementById('programTime');
    const programTitle = document.getElementById('programTitle');
    const programType = document.getElementById('programType');
    const realtimeStatus = document.getElementById('realtimeStatus');
    if (isEnglishEvent) {
      askLink.querySelector('strong').textContent = 'Ask a question';
      askClosedState.querySelector('strong').textContent = 'Q&A is currently closed';
      askClosedState.querySelector('span').textContent = 'The Ask a question button will appear when Q&A opens.';
      programLink.querySelector('strong').textContent = 'Event programme';
    }

    let unsubscribeEvent = null;
    let audienceVoteTimer = null;
    let audienceVoteBusy = false;
    let transitionTimer = null;
    let transitionGeneration = 0;
    let relevantRoomIds = new Set();
    let disposed = false;
    let refreshing = false;
    let refreshPending = false;
    let hasRendered = false;

    function finishBootstrap() {
      appShell.removeAttribute('inert');
      appShell.removeAttribute('aria-hidden');
      document.body.classList.remove('is-booting');
      document.body.classList.add('is-ready');
    }

    function showError(message) {
      bootstrapScreen.classList.add('is-error');
      bootstrapScreen.setAttribute('role', 'alert');
      bootstrapMessage.textContent = message;
    }

    function setRealtimeStatus(status) {
      if (disposed) return;
      const connected = status === 'SUBSCRIBED';
      const offline = ['CHANNEL_ERROR', 'TIMED_OUT', 'CLOSED'].includes(status);
      realtimeStatus.hidden = connected;
      realtimeStatus.dataset.state = offline ? 'offline' : 'connecting';
      realtimeStatus.textContent = offline ? txt('нет связи','Offline') : txt('подключение','Connecting…');
    }

    function reportRefreshError(error) {
      console.error('Event welcome refresh failed', error);
      if (!hasRendered) {
        showError(error?.code === 'EVENT_NOT_FOUND'
          ? txt('Мероприятие не найдено. Проверьте QR-код или ссылку.','Event not found. Check the link or QR code.')
          : txt('Не удалось загрузить мероприятие. Обновите страницу и попробуйте снова.','Could not load the event. Please refresh and try again.'));
      }
    }

    function queueRefresh() {
      void refresh().catch(reportRefreshError);
    }

    function formatTime(value) {
      if (value == null) return null;
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return null;
      return date.toLocaleTimeString(isEnglishEvent ? 'en-GB' : 'ru-RU', { hour: '2-digit', minute: '2-digit', timeZone: isEnglishEvent ? 'Europe/Moscow' : (brand.timeZone || undefined) });
    }

    function formatRange(item) {
      if (item.startMs == null || item.endMs == null) return '—';
      return `${formatTime(item.startMs)}–${formatTime(item.endMs)}`;
    }

    function itemType(item) {
      if (item.kind === 'service') return txt('Организационный блок','Programme block');
      return item.mode === 'panel' ? txt('Панель','Session') : txt('Выступление','Talk');
    }

    function transitionRetryDelay(attempt) {
      return Math.min(30_000, 2_000 * (2 ** Math.min(Math.max(0, attempt), 4)));
    }

    function scheduleTransitionRetry(generation, attempt) {
      if (disposed || generation !== transitionGeneration) return;
      clearTimeout(transitionTimer);
      transitionTimer = setTimeout(() => {
        transitionTimer = null;
        if (disposed || generation !== transitionGeneration) return;
        void refreshTransition(generation, attempt + 1);
      }, transitionRetryDelay(attempt));
    }

    async function refreshTransition(generation, attempt = 0) {
      if (disposed || generation !== transitionGeneration) return;
      try {
        await refresh();
      } catch (error) {
        reportRefreshError(error);
      }
      if (disposed || generation !== transitionGeneration) return;
      scheduleTransitionRetry(generation, attempt);
    }

    function armTransitionTimer(view) {
      clearTimeout(transitionTimer);
      transitionTimer = null;
      const generation = ++transitionGeneration;
      if (!view.nextTransitionAt) return;
      const delay = Math.max(50, Math.min(view.nextTransitionAt - Date.now() + 100, 2_147_000_000));
      transitionTimer = setTimeout(() => {
        transitionTimer = null;
        if (disposed || generation !== transitionGeneration) return;
        void refreshTransition(generation);
      }, delay);
    }

    function renderProgram(view) {
      const item = view.heroItem;
      const labels = {
        [PROGRAM_HERO_STATE.NOW]: txt('СЕЙЧАС','NOW'),
        [PROGRAM_HERO_STATE.NEXT]: txt('ДАЛЕЕ','NEXT'),
        [PROGRAM_HERO_STATE.COMPLETE]: txt('ПРОГРАММА ЗАВЕРШЕНА','PROGRAMME COMPLETED'),
        [PROGRAM_HERO_STATE.UNSCHEDULED]: txt('РАСПИСАНИЕ УТОЧНЯЕТСЯ','SCHEDULE TO BE CONFIRMED'),
        [PROGRAM_HERO_STATE.EMPTY]: txt('ПРОГРАММА','PROGRAMME')
      };
      programCard.dataset.mode = view.heroState.toLowerCase();
      programLabel.textContent = labels[view.heroState];
      programType.hidden = !item;

      if (item) {
        const endTime = item.endMs == null ? null : formatTime(item.endMs);
        programTime.textContent = view.heroState === PROGRAM_HERO_STATE.NOW && item.kind === 'service' && endTime
          ? `${txt('до','until')} ${endTime}`
          : (item.startMs == null || item.endMs == null
              ? txt('Время уточняется','Time to be confirmed')
              : formatRange(item));
        programTitle.textContent = item.title || txt('Без названия','Untitled');
        programType.textContent = itemType(item);
      } else {
        programTime.textContent = '—';
        programTitle.textContent = view.heroState === PROGRAM_HERO_STATE.COMPLETE
          ? txt('Спасибо, что были с нами','Thank you for joining us')
          : view.heroState === PROGRAM_HERO_STATE.UNSCHEDULED
            ? txt('Время блоков появится здесь','Session times will appear here')
            : txt('Расписание готовится','Programme coming soon');
      }
    }

    // Poll state is intentionally separate from Program v2 and Q&A.
    // Other event keys never call the Audience Choice API.
    async function refreshAudienceVote() {
      if (disposed || !audienceVoteEligible || audienceVoteBusy) return;
      audienceVoteBusy = true;
      try {
        const { data, error } = await supabase.rpc('audience_choice_event_status', {
          p_event_key: eventKey
        });
        if (error) throw error;
        if (!disposed) audienceVoteLink.hidden = !voteButtonVisible(data?.status);
      } catch (error) {
        // Fail closed if the poll is absent/unavailable: ordinary event stays usable.
        audienceVoteLink.hidden = true;
        console.warn('Audience Choice status unavailable', error);
      } finally {
        audienceVoteBusy = false;
      }
    }

    function render(snapshot) {
      const view = deriveGuestProgramState(snapshot.items, snapshot.operationalCurrentRoom);
      renderProgram(view);

      askLink.hidden = !view.canAskCurrent;
      askClosedState.hidden = view.canAskCurrent;
      armTransitionTimer(view);
    }

    async function refresh() {
      if (disposed) return;
      if (refreshing) {
        refreshPending = true;
        return;
      }
      refreshing = true;
      refreshPending = false;
      try {
        const snapshot = await loadGuestEventProgram(eventKey);
        if (disposed) return;
        relevantRoomIds = new Set(snapshot.items.filter(item => item.kind === 'session' && item.room_id != null).map(item => String(item.room_id)));
        render(snapshot);
        if (!hasRendered) {
          hasRendered = true;
          finishBootstrap();
        }
      } finally {
        refreshing = false;
        if (!disposed && refreshPending) {
          refreshPending = false;
          queueRefresh();
        }
      }
    }

    async function init() {
      if (!eventKey) {
        showError(txt('В ссылке не указано мероприятие.','Missing event in the link.'));
        return;
      }
      const route = encodeURIComponent(eventKey);
      askLink.href = `./ask.html?event=${route}`;
      if (eventKey === 'kdw-2026-finokhin') {
        programLink.querySelector('strong').textContent = 'Участники сессии';
        programLink.href = `./participants.html?event=${route}`;
      } else {
        programLink.href = `./program.html?event=${route}`;
      }
      telegramLink.hidden = eventKey !== 'tasigo-esg-2026';
      if (audienceVoteEligible) {
        // The existing event QR stays unchanged. This is an internal destination.
        audienceVoteLink.href = `./audience-vote.html?event=${route}`;
        void refreshAudienceVote();
        audienceVoteTimer = setInterval(refreshAudienceVote, 5000);
      }
      unsubscribeEvent = subscribeGuestEventProgram(eventKey, () => relevantRoomIds, queueRefresh, setRealtimeStatus);
      try {
        await refresh();
      } catch (error) {
        reportRefreshError(error);
      }
    }

    window.addEventListener('pageshow', event => {
      if (event.persisted && !disposed) {
        queueRefresh();
        void refreshAudienceVote();
      }
    });
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && !disposed) void refreshAudienceVote();
    });

    window.addEventListener('pagehide', event => {
      if (event.persisted) return;
      disposed = true;
      clearTimeout(transitionTimer);
      clearInterval(audienceVoteTimer);
      transitionGeneration += 1;
      unsubscribeEvent?.();
      unsubscribeEvent = null;
    });

    init();
  </script>
</body>
