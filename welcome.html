<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title></title>
  <link rel="stylesheet" href="./theme.css" />
  <link rel="stylesheet" data-brand-stylesheet href="./brands/sanchez.css" />
  <style>
    .event-entry { min-height: 100vh; display: grid; align-items: start; justify-items: center; padding: max(18px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom)); }
    .event-entry-shell { width: min(620px, 100%); display: grid; gap: 16px; }
    .event-entry-brand { display: flex; align-items: center; gap: 14px; padding: 8px 2px 4px; }
    .event-entry-brand .brand-logo-mark { width: 54px; height: 54px; border-radius: 17px; flex: 0 0 auto; box-shadow: 0 0 24px color-mix(in srgb, var(--color-accent) 22%, transparent); }
    .event-entry-brand-copy { min-width: 0; display: grid; gap: 5px; }
    .event-entry-brand-copy strong { color: var(--color-text); font-family: var(--font-display); font-size: clamp(16px, 4vw, 20px); font-weight: 800; line-height: 1.15; letter-spacing: .01em; }
    .event-entry-brand-copy span { color: var(--color-text-secondary); font-size: 10px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    .event-program { position: relative; overflow: hidden; padding: clamp(22px, 6vw, 34px); display: grid; gap: 0; background: radial-gradient(circle at 92% 6%, color-mix(in srgb, var(--color-accent) 10%, transparent), transparent 38%), var(--color-surface-raised); }
    .event-program-label { color: var(--color-accent-text); font-size: 10px; font-weight: 850; letter-spacing: .2em; text-transform: uppercase; }
    .event-program-time { margin-top: 14px; color: var(--color-text); font-size: clamp(24px, 6vw, 34px); font-weight: 850; line-height: 1; font-variant-numeric: tabular-nums; }
    .event-program-title { margin-top: 17px; color: var(--color-text); font-family: var(--font-display); font-size: clamp(28px, 7vw, 42px); font-weight: 800; line-height: 1.08; letter-spacing: -.03em; overflow-wrap: anywhere; }
    .event-program-type { margin-top: 15px; color: var(--color-text-secondary); font-size: 10px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    .event-entry-actions { display: grid; gap: 10px; margin-top: 26px; }
    .event-entry-action { min-height: 66px; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px 18px; border: 1px solid var(--color-border); border-radius: 18px; text-decoration: none; background: var(--color-surface-subtle); color: var(--color-text); transition: border-color .15s ease, transform .15s ease, background .15s ease; }
    .event-entry-action:hover { border-color: var(--color-border-strong); transform: translateY(-1px); }
    .event-entry-action.primary { background: var(--color-accent); color: var(--color-accent-contrast, #fff); border-color: transparent; }
    .event-entry-action strong { font-size: 16px; font-weight: 850; }
    .event-entry-action .event-entry-arrow { flex: 0 0 auto; font-size: 20px; line-height: 1; }
    .event-entry-foot { min-height: 18px; padding: 0 8px; color: var(--color-text-secondary); font-size: 10px; text-align: center; }
    .event-entry-realtime { display: inline-flex; align-items: center; gap: 6px; }
    .event-entry-realtime::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .event-entry-realtime[data-state="offline"] { color: var(--color-danger-text); }
    @media (max-width: 560px) {
      .event-entry { padding-top: max(14px, env(safe-area-inset-top)); }
      .event-entry-shell { gap: 13px; }
      .event-entry-brand { padding-bottom: 2px; }
      .event-entry-brand .brand-logo-mark { width: 50px; height: 50px; border-radius: 16px; }
      .event-program { padding: 22px 20px 20px; }
      .event-program-title { font-size: clamp(27px, 8vw, 34px); }
      .event-entry-action { min-height: 62px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .event-entry-action { transition: none; }
      .event-entry-action:hover { transform: none; }
    }
  </style>
</head>
<body class="is-booting">
  <div class="bootstrap-screen" id="bootstrapScreen" role="status" aria-live="polite">
    <div class="bootstrap-card">
      <div class="bootstrap-brand"><div class="brand-logo-mark" data-brand-mark></div><div class="bootstrap-brand-copy"><strong data-brand-name></strong><span data-brand-product></span></div></div>
      <p class="bootstrap-message" id="bootstrapMessage">Загрузка мероприятия…</p>
    </div>
  </div>

  <main class="event-entry app" id="appShell" inert aria-hidden="true">
    <div class="event-entry-shell">
      <header class="event-entry-brand">
        <div class="brand-logo-mark" data-brand-mark></div>
        <div class="event-entry-brand-copy"><strong data-brand-name></strong><span data-brand-product></span></div>
      </header>

      <section class="card event-program" id="programCard" aria-live="polite">
        <div class="event-program-label" id="programLabel"></div>
        <div class="event-program-time" id="programTime"></div>
        <div class="event-program-title" id="programTitle"></div>
        <div class="event-program-type" id="programType" hidden></div>

        <div class="event-entry-actions" id="entryActions">
          <a class="event-entry-action primary" id="askLink" href="#" hidden>
            <strong>Задать вопрос</strong>
            <span class="event-entry-arrow" aria-hidden="true">→</span>
          </a>
          <a class="event-entry-action" id="programLink" href="#">
            <strong>Программа дня</strong>
            <span class="event-entry-arrow" aria-hidden="true">→</span>
          </a>
        </div>
      </section>

      <div class="event-entry-foot">
        <span class="event-entry-realtime" id="realtimeStatus" data-state="connecting" role="status">подключение</span>
      </div>
    </div>
  </main>

  <script type="module">
    import { applyBrandIdentity, getBrandForRoute } from './brand.js';
    import { deriveGuestProgramState, PROGRAM_HERO_STATE } from './guest-program-state.mjs';
    import { getEventKey, loadGuestEventProgram, subscribeGuestEventProgram } from './supabase-qna.js';

    const eventKey = getEventKey();
    const brand = getBrandForRoute(null, eventKey);
    applyBrandIdentity('welcome', brand);

    const appShell = document.getElementById('appShell');
    const bootstrapScreen = document.getElementById('bootstrapScreen');
    const bootstrapMessage = document.getElementById('bootstrapMessage');
    const entryActions = document.getElementById('entryActions');
    const askLink = document.getElementById('askLink');
    const programLink = document.getElementById('programLink');
    const programCard = document.getElementById('programCard');
    const programLabel = document.getElementById('programLabel');
    const programTime = document.getElementById('programTime');
    const programTitle = document.getElementById('programTitle');
    const programType = document.getElementById('programType');
    const realtimeStatus = document.getElementById('realtimeStatus');

    let unsubscribeEvent = null;
    let transitionTimer = null;
    let transitionGeneration = 0;
    let relevantRoomIds = new Set();
    let disposed = false;
    let refreshing = false;
    let refreshPending = false;
    let hasRendered = false;

    function finishBootstrap() {
      appShell.removeAttribute('inert');
      appShell.removeAttribute('aria-hidden');
      document.body.classList.remove('is-booting');
      document.body.classList.add('is-ready');
    }

    function showError(message) {
      bootstrapScreen.classList.add('is-error');
      bootstrapScreen.setAttribute('role', 'alert');
      bootstrapMessage.textContent = message;
    }

    function setRealtimeStatus(status) {
      if (disposed) return;
      const connected = status === 'SUBSCRIBED';
      const offline = ['CHANNEL_ERROR', 'TIMED_OUT', 'CLOSED'].includes(status);
      realtimeStatus.hidden = connected;
      realtimeStatus.dataset.state = offline ? 'offline' : 'connecting';
      realtimeStatus.textContent = offline ? 'нет связи' : 'подключение';
    }

    function reportRefreshError(error) {
      console.error('Event welcome refresh failed', error);
      if (!hasRendered) {
        showError(error?.code === 'EVENT_NOT_FOUND'
          ? 'Мероприятие не найдено. Проверьте QR-код или ссылку.'
          : 'Не удалось загрузить мероприятие. Обновите страницу и попробуйте снова.');
      }
    }

    function queueRefresh() {
      void refresh().catch(reportRefreshError);
    }

    function formatTime(value) {
      if (value == null) return null;
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return null;
      return date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    }

    function formatRange(item) {
      if (item.startMs == null || item.endMs == null) return '—';
      return `${formatTime(item.startMs)}–${formatTime(item.endMs)}`;
    }

    function itemType(item) {
      if (item.kind === 'service') return 'Перерыв';
      return item.mode === 'panel' ? 'Панель' : 'Выступление';
    }

    function transitionRetryDelay(attempt) {
      return Math.min(30_000, 2_000 * (2 ** Math.min(Math.max(0, attempt), 4)));
    }

    function scheduleTransitionRetry(generation, attempt) {
      if (disposed || generation !== transitionGeneration) return;
      clearTimeout(transitionTimer);
      transitionTimer = setTimeout(() => {
        transitionTimer = null;
        if (disposed || generation !== transitionGeneration) return;
        void refreshTransition(generation, attempt + 1);
      }, transitionRetryDelay(attempt));
    }

    async function refreshTransition(generation, attempt = 0) {
      if (disposed || generation !== transitionGeneration) return;
      try {
        await refresh();
      } catch (error) {
        reportRefreshError(error);
      }
      if (disposed || generation !== transitionGeneration) return;
      scheduleTransitionRetry(generation, attempt);
    }

    function armTransitionTimer(view) {
      clearTimeout(transitionTimer);
      transitionTimer = null;
      const generation = ++transitionGeneration;
      if (!view.nextTransitionAt) return;
      const delay = Math.max(50, Math.min(view.nextTransitionAt - Date.now() + 100, 2_147_000_000));
      transitionTimer = setTimeout(() => {
        transitionTimer = null;
        if (disposed || generation !== transitionGeneration) return;
        void refreshTransition(generation);
      }, delay);
    }

    function renderProgram(view) {
      const item = view.heroItem;
      const labels = {
        [PROGRAM_HERO_STATE.NOW]: 'СЕЙЧАС',
        [PROGRAM_HERO_STATE.NEXT]: 'ДАЛЕЕ',
        [PROGRAM_HERO_STATE.COMPLETE]: 'ПРОГРАММА ЗАВЕРШЕНА',
        [PROGRAM_HERO_STATE.UNSCHEDULED]: 'РАСПИСАНИЕ УТОЧНЯЕТСЯ',
        [PROGRAM_HERO_STATE.EMPTY]: 'ПРОГРАММА'
      };
      programCard.dataset.mode = view.heroState.toLowerCase();
      programLabel.textContent = labels[view.heroState];
      programType.hidden = !item;

      if (item) {
        programTime.textContent = view.heroState === PROGRAM_HERO_STATE.NOW && item.kind === 'service'
          ? `до ${formatTime(item.endMs)}`
          : formatRange(item);
        programTitle.textContent = item.title || 'Без названия';
        programType.textContent = itemType(item);
      } else {
        programTime.textContent = '—';
        programTitle.textContent = view.heroState === PROGRAM_HERO_STATE.COMPLETE
          ? 'Спасибо, что были с нами'
          : view.heroState === PROGRAM_HERO_STATE.UNSCHEDULED
            ? 'Время блоков появится здесь'
            : 'Расписание готовится';
      }
    }

    function render(snapshot) {
      const view = deriveGuestProgramState(snapshot.items, snapshot.operationalCurrentRoom);
      renderProgram(view);

      askLink.hidden = !view.canAskCurrent;
      armTransitionTimer(view);
    }

    async function refresh() {
      if (disposed) return;
      if (refreshing) {
        refreshPending = true;
        return;
      }
      refreshing = true;
      refreshPending = false;
      try {
        const snapshot = await loadGuestEventProgram(eventKey);
        if (disposed) return;
        relevantRoomIds = new Set(snapshot.items.filter(item => item.kind === 'session' && item.room_id != null).map(item => String(item.room_id)));
        render(snapshot);
        if (!hasRendered) {
          hasRendered = true;
          finishBootstrap();
        }
      } finally {
        refreshing = false;
        if (!disposed && refreshPending) {
          refreshPending = false;
          queueRefresh();
        }
      }
    }

    async function init() {
      if (!eventKey) {
        showError('В ссылке не указано мероприятие.');
        return;
      }
      const route = encodeURIComponent(eventKey);
      askLink.href = `./ask.html?event=${route}`;
      programLink.href = `./program.html?event=${route}`;
      unsubscribeEvent = subscribeGuestEventProgram(eventKey, () => relevantRoomIds, queueRefresh, setRealtimeStatus);
      try {
        await refresh();
      } catch (error) {
        reportRefreshError(error);
      }
    }

    window.addEventListener('pageshow', event => {
      if (event.persisted && !disposed) queueRefresh();
    });

    window.addEventListener('pagehide', event => {
      if (event.persisted) return;
      disposed = true;
      clearTimeout(transitionTimer);
      transitionGeneration += 1;
      unsubscribeEvent?.();
      unsubscribeEvent = null;
    });

    init();
  </script>
</body>
</html>
