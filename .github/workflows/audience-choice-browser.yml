name: Audience Choice browser rehearsal
on:
  pull_request:
    paths:
      - 'welcome.html'
      - 'audience-vote.html'
      - 'audience-choice-flow.mjs'
      - 'audience-choice-admin.mjs'
      - 'tests/audience-choice-browser.mjs'
      - 'tests/audience-choice-admin-fixture.html'
      - '.github/workflows/audience-choice-browser.yml'
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned Playwright for CI rehearsal
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Mobile viewport and operator UI smoke (mock backend)
        run: node tests/audience-choice-browser.mjs
