name: LIVE Q&A regression
on:
  pull_request:
  push:
    branches: [main, test/s1-*]
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check guest program module syntax
        run: node --check guest-program-state.mjs
      - name: Run guest program regression tests
        run: node --test tests/*.test.mjs
