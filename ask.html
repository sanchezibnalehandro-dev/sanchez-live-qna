<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title></title>
  <link rel="stylesheet" href="./theme.css" />
  <link rel="stylesheet" data-brand-stylesheet />
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const room = (params.get('room') || '').trim();
      const event = (params.get('event') || '').trim();
      const isTasigo = room.startsWith('tasigo-esg-') || event.startsWith('tasigo-esg-');
      document.querySelector('[data-brand-stylesheet]').href = isTasigo ? './brands/tasigo-esg.css' : './brands/sanchez.css';
    })();
  </script>
  <style>
    /* Страница гостя — центрированная, максимум 680px */
    .guest-shell { max-width: 680px; }

    /* Кнопка отправки — полная ширина */
    #submitBtn { width: 100%; padding: 14px; font-size: 15px; }

    /* Вопрос с голосованием */
    .q-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .q-body { flex: 1; min-width: 0; }
    .vote-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .vote-count {
      font-size: 13px;
      font-weight: 700;
      color: var(--color-accent-text);
      line-height: 1;
    }
    .vote-btn-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid color-mix(in srgb, var(--color-accent-hover) 28%, transparent);
      background: color-mix(in srgb, var(--color-accent-hover) 10%, transparent);
      color: var(--color-accent-text);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.15s, box-shadow 0.15s, border-color 0.15s;
      font-family: inherit;
    }
    .vote-btn-circle:hover { background: color-mix(in srgb, var(--color-accent-hover) 22%, transparent); transform: scale(1.08); }
    .vote-btn-circle:active { transform: scale(0.95); }
    .vote-btn-circle.voted {
      background: color-mix(in srgb, var(--color-accent-hover) 35%, transparent);
      border-color: color-mix(in srgb, var(--color-accent-hover) 70%, transparent);
    }
    .vote-btn-circle.voted + .vote-count {
      text-shadow: 0 0 8px color-mix(in srgb, var(--color-accent-hover) 50%, transparent);
    }
    .vote-btn-circle.burst {
      animation: vote-burst 0.4s ease-out;
    }
    @keyframes vote-burst {
      0%   { transform: scale(1); box-shadow: 0 0 0 0 color-mix(in srgb, var(--color-accent-hover) 60%, transparent); }
      40%  { transform: scale(1.25); box-shadow: 0 0 16px 4px color-mix(in srgb, var(--color-accent-hover) 60%, transparent); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 color-mix(in srgb, var(--color-accent-hover) 0%, transparent); }
    }

    #nameInput, #companyInput { font-size: 13px; }

    .live-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .live-tag-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse-dot 2s infinite;
    }
    .live-tag.connecting .live-tag-dot { background: var(--color-warning); animation: none; }
    .live-tag.offline .live-tag-dot { background: var(--color-danger); animation: none; }

    /* Индикатор состояния приёма */
    .reception-indicator {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .reception-indicator.open {
      background: color-mix(in srgb, var(--color-success) 12%, transparent);
      border: 1px solid color-mix(in srgb, var(--color-success) 30%, transparent);
      color: var(--color-success-accent);
    }
    .reception-indicator.closed {
      background: color-mix(in srgb, var(--color-warning) 8%, transparent);
      border: 1px solid color-mix(in srgb, var(--color-warning) 20%, transparent);
      color: var(--color-warning);
    }
    .reception-indicator .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .reception-indicator.open  .dot { background: var(--color-success-accent); box-shadow: 0 0 6px var(--color-success-accent); animation: pulse-dot 1.8s infinite; }
    .reception-indicator.closed .dot { background: var(--color-warning); }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.35; }
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      pointer-events: none;
    }
    .toast-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 999px;
      background: var(--color-surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid color-mix(in srgb, var(--color-text-on-accent) 10%, transparent);
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      animation: toastIn 0.35s ease-out;
      pointer-events: auto;
    }
    .toast-item.success { border-color: color-mix(in srgb, var(--color-success) 40%, transparent); }
    .toast-item.success .toast-icon { color: var(--green); }
    .toast-item.error { border-color: color-mix(in srgb, var(--color-danger) 40%, transparent); }
    .toast-item.error .toast-icon { color: var(--danger); }
    .toast-item.out { animation: toastOut 0.3s ease-in forwards; }
    .toast-icon { font-size: 15px; line-height: 1; }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes toastOut {
      from { opacity: 1; transform: translateY(0); }
      to   { opacity: 0; transform: translateY(10px); }
    }

    /* Баннер закрытия (оставляем для совместимости) */
    .closed-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-radius: var(--radius-lg);
      background: color-mix(in srgb, var(--color-warning) 7%, transparent);
      border: 1px solid color-mix(in srgb, var(--color-warning) 18%, transparent);
      color: var(--color-warning-text);
      font-size: 14px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="app">
    <main class="shell guest-shell">

      <!-- Шапка -->
      <section class="card">
        <div class="card-inner" style="padding:24px;">
          <div style="display:flex; justify-content:space-between; align-items:flex-start;">
            <div class="brand-logo">
              <div class="brand-logo-mark" data-brand-mark></div>
              <span class="brand-logo-text"><span data-brand-name></span> · <span data-brand-product></span></span>
            </div>
            <span id="receptionIndicator" class="reception-indicator open">
              <span class="dot"></span>
              <span id="receptionLabel">Приём открыт</span>
            </span>
          </div>
          <h1 id="speakerName" style="margin-top:4px;">Задать вопрос</h1>
          <p class="subcopy" id="speakerMeta">Загрузка данных спикера…</p>
          <div id="panelParticipants" style="display:none; margin-top:16px;">
            <div style="font-size:11px; text-transform:uppercase; letter-spacing:0.12em; color:var(--muted); margin-bottom:8px;">Участники сессии</div>
            <div id="panelParticipantsList" class="row" style="flex-wrap:wrap; gap:6px;"></div>
          </div>
        </div>
      </section>

      <!-- Баннер закрытия (скрыт по умолчанию) -->
      <div class="closed-banner" id="closedBanner" style="display:none;">
        <span>⏸</span>
        <span>Приём вопросов временно приостановлен.</span>
      </div>

      <!-- Форма вопроса -->
      <section class="card" id="formCard">
        <div class="card-inner stack" style="gap:14px;">
          <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;">
            <h2 class="section-title" style="margin:0;">Ваш вопрос</h2>
            <span id="charCount" style="font-size:11px; color:var(--muted);">0 / 200</span>
          </div>
          <textarea class="textarea" id="questionInput" placeholder="Напишите вопрос спикеру…" maxlength="200" style="min-height:110px;"></textarea>
          <div id="guestIdentityFields">
            <div class="divider"></div>
            <div style="font-size:11px; text-transform:uppercase; letter-spacing:0.12em; color:var(--muted); margin-bottom:-4px;">Имя и компания (опционально)</div>
            <div class="meta-grid" style="margin-top:14px;">
              <input class="input" id="nameInput" placeholder="Ваше имя (опционально)" maxlength="120" />
              <input class="input" id="companyInput" placeholder="Компания (опционально)" maxlength="120" />
            </div>
          </div>
          <button class="btn primary" id="submitBtn">Отправить вопрос</button>
        </div>
      </section>

      <!-- Лента вопросов -->
      <section class="card">
        <div class="card-inner">
          <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:14px;">
            <h2 class="section-title" style="margin:0;">Вопросы <span class="badge open" id="countBadge" style="vertical-align:middle;">0</span></h2>
            <span class="live-tag connecting" id="realtimeStatus"><span class="live-tag-dot"></span> подключение…</span>
          </div>
          <div class="list" id="questionsList">
            <div class="empty">Вопросов пока нет — задайте первый!</div>
          </div>
        </div>
      </section>

    </main>
  </div>

  <div id="toast"></div>
  <script type="module">
    import { applyBrandIdentity, getBrandForRoute } from './brand.js';
    import {
      getRoomSlug, getEventKey, getGuestSessionId, getRoomBySlug, getCurrentEventRoom, getActiveSpeaker,
      listSpeakers, listQuestions, submitGuestQuestion, addVote, removeVote, subscribeRoom, subscribeEvent,
      escapeHtml, formatClock, normalizeQuestion
    } from './supabase-qna.js';

    const eventKey = getEventKey();
    const requestedRoomSlug = getRoomSlug();
    let activeRoomSlug = eventKey ? null : requestedRoomSlug;
    applyBrandIdentity('guest', getBrandForRoute(requestedRoomSlug, eventKey));
    let sessionId = null;

    const speakerNameEl = document.getElementById('speakerName');
    const speakerMetaEl = document.getElementById('speakerMeta');
    const panelParticipants = document.getElementById('panelParticipants');
    const panelParticipantsList = document.getElementById('panelParticipantsList');
    const questionInput  = document.getElementById('questionInput');
    const nameInput      = document.getElementById('nameInput');
    const companyInput   = document.getElementById('companyInput');
    const guestIdentityFields = document.getElementById('guestIdentityFields');
    const submitBtn      = document.getElementById('submitBtn');
    const toastEl        = document.getElementById('toast');
    const questionsList  = document.getElementById('questionsList');
    const closedBanner   = document.getElementById('closedBanner');
    const formCard       = document.getElementById('formCard');
    const countBadge     = document.getElementById('countBadge');

    function loadLocalSet(key) {
      try {
        const parsed = JSON.parse(localStorage.getItem(key) || '[]');
        return new Set(Array.isArray(parsed) ? parsed : []);
      } catch {
        return new Set();
      }
    }

    function saveLocalSet(key, values) {
      try {
        localStorage.setItem(key, JSON.stringify([...values]));
      } catch {
        // Current in-memory state remains valid even if browser storage is unavailable.
      }
    }

    // Голоса и собственные вопросы храним отдельно для каждой фактической room.
    let myVotes = new Set();
    let myQuestions = new Set();
    function syncLocalQuestionState(roomSlug) {
      activeRoomSlug = roomSlug;
      myVotes = loadLocalSet(`qna-votes:${roomSlug}`);
      myQuestions = loadLocalSet(`qna-own-questions:${roomSlug}`);
    }
    function saveVotes() { if (activeRoomSlug) saveLocalSet(`qna-votes:${activeRoomSlug}`, myVotes); }
    function saveMyQuestions() { if (activeRoomSlug) saveLocalSet(`qna-own-questions:${activeRoomSlug}`, myQuestions); }

    function saveDraft(roomSlug) {
      if (!roomSlug) return;
      try { sessionStorage.setItem(`qna-draft:${roomSlug}`, questionInput.value); } catch {}
    }

    function loadDraft(roomSlug) {
      try { questionInput.value = sessionStorage.getItem(`qna-draft:${roomSlug}`) || ''; }
      catch { questionInput.value = ''; }
      updateCharCount();
    }

    function clearDraft(roomSlug) {
      try { sessionStorage.removeItem(`qna-draft:${roomSlug}`); } catch {}
    }

    const state = { room: null, speaker: null, speakers: [], questions: [] };
    let unsubscribeRoom = null;
    let unsubscribeEvent = null;
    let subscribedRoomId = null;
    const realtimeChannels = { room: 'CONNECTING', event: eventKey ? 'CONNECTING' : 'SUBSCRIBED' };
    let _refreshing = false;
    let _pendingRefresh = false;
    let submittingQuestion = false;
    const pendingVoteIds = new Set();

    // Счётчик символов
    const charCount = document.getElementById('charCount');
    const LIMIT = 200;
    questionInput.setAttribute('maxlength', LIMIT);
    function updateCharCount() {
      const len = questionInput.value.length;
      charCount.textContent = `${len} / ${LIMIT}`;
      charCount.style.color = len > LIMIT * 0.9 ? (len >= LIMIT ? 'var(--danger)' : 'var(--yellow)') : 'var(--muted)';
    }
    updateCharCount();
    questionInput.addEventListener('input', () => {
      updateCharCount();
      saveDraft(activeRoomSlug);
    });

    submitBtn.addEventListener('click', onSubmit);
    boot();

    async function boot() {
      try {
        if (eventKey) {
          unsubscribeEvent = subscribeEvent(eventKey, queueRefresh, (status) => setRealtimeChannelStatus('event', status));
        }
        await refresh();
      } catch (e) {
        const noCurrentSession = e?.code === 'CURRENT_SESSION_NOT_SET';
        const isNotFound = e?.code === 'PGRST116' || String(e?.message || '').includes('JSON object requested');
        speakerNameEl.textContent = noCurrentSession ? 'Сессия ещё не выбрана' : isNotFound ? 'Комната не найдена' : 'Ошибка загрузки';
        speakerMetaEl.textContent = noCurrentSession
          ? 'Для этого мероприятия пока не назначена текущая сессия.'
          : isNotFound
            ? `Комната «${requestedRoomSlug}» не существует. Проверьте QR-код или ссылку.`
            : (e?.message || 'Не удалось загрузить данные. Попробуйте обновить страницу.');
        document.getElementById('formCard').style.display = 'none';
      }
    }

    async function resolveRoom() {
      if (!eventKey) return getRoomBySlug(requestedRoomSlug);
      const room = await getCurrentEventRoom(eventKey);
      if (room) return room;
      const error = new Error('Для мероприятия не выбрана текущая сессия.');
      error.code = 'CURRENT_SESSION_NOT_SET';
      throw error;
    }

    function setRealtimeChannelStatus(channel, status) {
      realtimeChannels[channel] = status;
      const statuses = Object.values(realtimeChannels);
      if (statuses.some(value => value === 'CHANNEL_ERROR' || value === 'TIMED_OUT' || value === 'CLOSED')) {
        setRealtimeStatus('CHANNEL_ERROR');
      } else if (statuses.every(value => value === 'SUBSCRIBED')) {
        setRealtimeStatus('SUBSCRIBED');
      } else {
        setRealtimeStatus('CONNECTING');
      }
    }

    function ensureRoomSubscription(roomId) {
      if (subscribedRoomId === roomId && unsubscribeRoom) return;
      unsubscribeRoom?.();
      subscribedRoomId = roomId;
      realtimeChannels.room = 'CONNECTING';
      setRealtimeChannelStatus('room', 'CONNECTING');
      unsubscribeRoom = subscribeRoom(roomId, queueRefresh, (status) => setRealtimeChannelStatus('room', status));
    }

    function reportRefreshError(error) {
      console.error('Guest data refresh failed', error);
      showToast('Не удалось обновить данные. Проверьте соединение.', 'error');
    }

    function queueRefresh() {
      void refresh().catch(reportRefreshError);
    }

    async function refresh() {
      if (_refreshing) { _pendingRefresh = true; return; }
      _refreshing = true;
      _pendingRefresh = false;
      try {
        const nextRoom = await resolveRoom();
        const roomChanged = state.room?.id !== nextRoom.id;
        const previousRoomSlug = activeRoomSlug;
        if (roomChanged && previousRoomSlug) saveDraft(previousRoomSlug);
        state.room = nextRoom;
        if (roomChanged || activeRoomSlug !== state.room.slug) {
          syncLocalQuestionState(state.room.slug);
          if (roomChanged) loadDraft(state.room.slug);
          applyBrandIdentity('guest', getBrandForRoute(state.room.slug, eventKey));
        }
        const sessionScope = state.room.event_key ? `event:${state.room.event_key}` : state.room.slug;
        sessionId = getGuestSessionId(sessionScope);
        ensureRoomSubscription(state.room.id);
        const isPanel = state.room.mode === 'panel';
        state.speaker = isPanel ? null : await getActiveSpeaker(state.room.id);
        state.speakers = isPanel ? await listSpeakers(state.room.id) : [];
        state.questions = await listQuestions(state.room.id, isPanel ? null : state.speaker?.id, { includeHidden: false, includeAsked: true });
        render();
      } finally {
        _refreshing = false;
        if (_pendingRefresh) {
          _pendingRefresh = false;
          queueRefresh();
        }
      }
    }

    function render() {
      formCard.style.display = '';
      const isPanel = state.room?.mode === 'panel';
      const fallback = state.room?.fallback_label || 'Вопросы спикеру';
      const name = isPanel
        ? (state.room?.title || fallback)
        : (state.speaker?.name || state.speaker?.fallback_label || fallback);
      const metadata = isPanel
        ? [state.room?.moderator_name && `Модератор: ${state.room.moderator_name}`, state.room?.moderator_regalia]
        : [state.speaker?.regalia, state.speaker?.topic];

      speakerNameEl.textContent = name;
      speakerMetaEl.innerHTML = metadata
        .filter(Boolean)
        .map(value => `<span>${escapeHtml(value)}</span>`)
        .join('<br>') || (isPanel ? 'Сессия' : 'Готовимся к сессии…');

      panelParticipants.style.display = isPanel ? 'block' : 'none';
      panelParticipantsList.innerHTML = isPanel
        ? (state.speakers.length
          ? state.speakers.map((speaker) => `<span class="badge open" style="font-size:10px; padding:5px 8px;">${escapeHtml(speaker.name || speaker.fallback_label || 'Участник')}</span>`).join('')
          : '<span style="font-size:12px; color:var(--muted);">Список участников уточняется.</span>')
        : '';
      guestIdentityFields.style.display = isPanel ? 'none' : 'block';
      questionInput.placeholder = isPanel ? 'Напишите вопрос модератору…' : 'Напишите вопрос спикеру…';

      const isCurrentEventSession = !state.room?.event_key || state.room?.is_current_session === true;
      const isOpen = isCurrentEventSession && state.room?.is_questions_open;
      closedBanner.style.display = isOpen ? 'none' : 'flex';
      questionInput.disabled = !isOpen;
      nameInput.disabled = !isOpen;
      companyInput.disabled = !isOpen;
      submitBtn.disabled = !isOpen || submittingQuestion;
      formCard.style.opacity = isOpen ? '1' : '0.65';
      formCard.setAttribute('aria-disabled', String(!isOpen));

      // Индикатор приёма
      const indicator = document.getElementById('receptionIndicator');
      const label     = document.getElementById('receptionLabel');
      indicator.className = `reception-indicator ${isOpen ? 'open' : 'closed'}`;
      label.textContent   = isOpen ? 'Приём открыт' : 'Приём закрыт';

      // Лента вопросов
      const qs = state.questions.filter(q => q.status !== 'hidden');
      countBadge.textContent = String(qs.length);

      if (!qs.length) {
        questionsList.innerHTML = `<div class="empty">
          <svg class="empty-icon" width="48" height="48" viewBox="0 0 48 48" fill="none">
            <rect x="8" y="12" width="32" height="26" rx="6" stroke="var(--color-text-secondary)" stroke-width="1.5"/>
            <path d="M8 30l10-6 6 4 8-8 8 6" stroke="var(--color-accent-hover)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
            <circle cx="24" cy="8" r="3" stroke="var(--color-text-secondary)" stroke-width="1.5"/>
            <line x1="24" y1="5" x2="24" y2="2" stroke="var(--color-text-secondary)" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="28" y1="6" x2="30" y2="4" stroke="var(--color-text-secondary)" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="20" y1="6" x2="18" y2="4" stroke="var(--color-text-secondary)" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <div class="empty-title">${isOpen ? 'Будьте первым' : 'Вопросов пока нет'}</div>
          ${isOpen ? `<div class="empty-sub">${isPanel ? 'Задайте вопрос модератору' : 'Задайте вопрос спикеру'}</div>` : ''}
        </div>`;
        return;
      }

      questionsList.innerHTML = qs.map((item) => {
        const author  = [item.author_name, item.author_company].filter(Boolean).join(' · ');
        const voted    = myVotes.has(item.id);
        const isOwn    = myQuestions.has(item.id);
        const isAsked  = item.status === 'asked';
        const votePending = pendingVoteIds.has(item.id);
        const blocked  = isAsked || isOwn || votePending || !isCurrentEventSession;
        return `
          <div class="question-card" style="${isAsked ? 'opacity:0.6;' : ''}">
            <div class="q-row">
              <div class="q-body">
                <div class="question-text">${escapeHtml(item.text)}</div>
                <div class="question-meta" style="margin-top:6px;">
                  ${isOwn ? '<span class="badge open" style="font-size:9px;padding:2px 6px;">ваш</span> · ' : ''}${author ? escapeHtml(author) + ' · ' : ''}${formatClock(item.created_at)}
                  ${item.is_pinned ? ' · <span class="badge pinned" style="font-size:9px;">закреплён</span>' : ''}
                  ${isAsked ? ' · <span class="badge asked" style="font-size:9px;">задан</span>' : ''}
                </div>
              </div>
              <div class="vote-col">
                <button
                  class="vote-btn-circle ${voted ? 'voted' : ''}"
                  data-id="${item.id}"
                  ${blocked ? `disabled${votePending ? ' aria-busy="true"' : ''} style="opacity:0.35;cursor:default;transform:none;"` : ''}
                  title="${isOwn ? 'Нельзя голосовать за свой вопрос' : isAsked ? 'Вопрос уже задан' : voted ? 'Нажмите чтобы снять голос' : 'Поддержать вопрос'}"
                >${isOwn ? '—' : voted ? '✓' : '▲'}</button>
                <span class="vote-count">${item.votes_count || 0}</span>
              </div>
            </div>
          </div>`;
      }).join('');

      questionsList.querySelectorAll('.vote-btn-circle').forEach((btn) => {
        btn.addEventListener('click', async () => {
          if (btn.disabled) return;
          const id = Number(btn.dataset.id);
          const alreadyVoted = myVotes.has(id);
          if (pendingVoteIds.has(id)) return;
          pendingVoteIds.add(id);
          btn.disabled = true;
          btn.setAttribute('aria-busy', 'true');
          btn.classList.remove('burst');
          void btn.offsetWidth;
          btn.classList.add('burst');
          btn.addEventListener('animationend', () => btn.classList.remove('burst'), { once: true });
          let voteSaved = false;
          try {
            if (alreadyVoted) {
              await removeVote(id, sessionId);
              myVotes.delete(id);
            } else {
              await addVote(id, sessionId);
              myVotes.add(id);
            }
            voteSaved = true;
            saveVotes();
          } catch (e) {
            showToast(alreadyVoted ? 'Не удалось снять голос' : 'Не удалось поставить +1', 'error');
          }
          try {
            if (voteSaved) await refresh();
          } catch (e) {
            showToast('Голос сохранён, но данные не удалось обновить.', 'error');
          } finally {
            pendingVoteIds.delete(id);
            render();
          }
        });
      });
    }

    async function onSubmit() {
      if (state.room?.is_questions_open !== true) {
        showToast('Приём вопросов закрыт.', 'error');
        return;
      }
      if (submittingQuestion) return;
      const text = normalizeQuestion(questionInput.value);
      if (!text) { showToast('Напишите вопрос.', 'error'); return; }
      submittingQuestion = true;
      submitBtn.disabled = true;
      submitBtn.textContent = 'Отправляю…';
      let questionSubmitted = false;
      try {
        const newQ = await submitGuestQuestion({
          roomId: state.room.id,
          speakerId: state.room.mode === 'panel' ? null : state.speaker?.id || null,
          text,
          authorName: state.room.mode === 'panel' ? '' : nameInput.value,
          authorCompany: state.room.mode === 'panel' ? '' : companyInput.value,
          sessionId
        });
        questionSubmitted = true;
        // Запоминаем свой вопрос отдельно от голосов; storage failure не отменяет подтверждённый INSERT.
        if (newQ?.id) { myQuestions.add(newQ.id); saveMyQuestions(); }
        questionInput.value = '';
        clearDraft(activeRoomSlug);
        updateCharCount();
        nameInput.value = '';
        companyInput.value = '';
        showToast(newQ?.status === 'pending' ? 'Вопрос отправлен на модерацию.' : 'Вопрос опубликован!', 'success');
      } catch (e) {
        const message = String(e?.message || '');
        if (message.includes('SESSION_NOT_CURRENT')) {
          showToast('Эта сессия уже не текущая. Страница обновляется.', 'error');
          queueRefresh();
        } else {
          showToast(e.message || 'Не удалось отправить вопрос.', 'error');
        }
      }
      try {
        if (questionSubmitted) await refresh();
      } catch (e) {
        showToast('Вопрос сохранён, но данные не удалось обновить.', 'error');
      } finally {
        submittingQuestion = false;
        submitBtn.disabled = !state.room?.is_questions_open;
        submitBtn.textContent = 'Отправить вопрос';
      }
    }

    function showToast(message, type = '') {
      toastEl.innerHTML = '';
      const icon = type === 'success' ? '✓' : type === 'error' ? '✗' : '';
      const el = document.createElement('div');
      el.className = `toast-item ${type}`.trim();
      el.innerHTML = icon ? `<span class="toast-icon">${icon}</span>${message}` : message;
      toastEl.appendChild(el);
      setTimeout(() => {
        el.classList.add('out');
        el.addEventListener('animationend', () => el.remove(), { once: true });
      }, 3000);
    }

    function setRealtimeStatus(status) {
      const realtimeStatus = document.getElementById('realtimeStatus');
      if (status === 'SUBSCRIBED') {
        realtimeStatus.className = 'live-tag';
        realtimeStatus.innerHTML = '<span class="live-tag-dot"></span> live';
      } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
        realtimeStatus.className = 'live-tag offline';
        realtimeStatus.innerHTML = '<span class="live-tag-dot"></span> нет связи';
      } else {
        realtimeStatus.className = 'live-tag connecting';
        realtimeStatus.innerHTML = '<span class="live-tag-dot"></span> подключение…';
      }
    }
  </script>
</body>
</html>
