<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Админка — Altera Q&A</title>
  <link rel="stylesheet" href="./theme.css" />
  <style>
    .toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; border-radius: var(--radius-md);
      background: var(--surface-2); border: 1px solid var(--border-2);
    }
    .toggle-label { font-size: 13px; font-weight: 600; color: var(--text); }
    .toggle-sub   { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .toggle-pill  { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
    .toggle-pill input { opacity: 0; width: 0; height: 0; }
    .toggle-track {
      position: absolute; inset: 0; border-radius: 999px;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1);
      cursor: pointer; transition: background 0.2s;
    }
    .toggle-track::after {
      content: ''; position: absolute; left: 3px; top: 3px;
      width: 16px; height: 16px; border-radius: 50%;
      background: #fff; transition: transform 0.2s;
    }
    .toggle-pill input:checked + .toggle-track { background: var(--blue); border-color: var(--blue-light); }
    .toggle-pill input:checked + .toggle-track::after { transform: translateX(20px); }

    /* Кастомный select */
    .custom-select-wrap { position: relative; }
    .custom-select-btn {
      width: 100%; padding: 11px 36px 11px 14px;
      border-radius: var(--radius-md); border: 1px solid var(--border-2);
      background: rgba(255,255,255,0.05); color: var(--text);
      font-family: inherit; font-size: 14px; text-align: left;
      cursor: pointer; transition: border-color 0.2s;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .custom-select-btn:hover { border-color: rgba(59,130,246,0.4); }
    .custom-select-btn .arrow { flex-shrink: 0; color: var(--muted); font-size: 10px; }
    .custom-select-dropdown {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 100;
      background: #0d1f3c; border: 1px solid rgba(59,130,246,0.25);
      border-radius: var(--radius-md); overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      display: none;
    }
    .custom-select-dropdown.open { display: block; }
    .custom-select-option {
      padding: 10px 14px; font-size: 13px; color: var(--text);
      cursor: pointer; transition: background 0.12s;
    }
    .custom-select-option:hover   { background: rgba(59,130,246,0.15); }
    .custom-select-option.selected { background: rgba(59,130,246,0.2); color: #93c5fd; }

    /* Спикер-карточка */
    .speaker-row {
      display: flex; align-items: center; gap: 12px; padding: 10px 12px;
      border-radius: var(--radius-md); background: var(--surface-2);
      border: 1px solid var(--border-2); cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .speaker-row:hover  { border-color: rgba(59,130,246,0.3); background: rgba(255,255,255,0.05); }
    .speaker-row.active { border-color: rgba(59,130,246,0.5); background: rgba(26,79,216,0.12); }
    .speaker-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg, var(--blue), var(--blue-light));
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 800; color: #fff; flex-shrink: 0;
    }
    .speaker-info { flex: 1; min-width: 0; }
    .speaker-name { font-size: 13px; font-weight: 600; color: var(--text); }
    .speaker-meta { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Зона выхода внизу */
    .danger-zone {
      margin-top: 8px; padding: 16px 20px;
      border-radius: var(--radius-xl); border: 1px solid rgba(248,113,113,0.12);
      background: rgba(248,113,113,0.04);
    }
    .danger-zone-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.16em;
      text-transform: uppercase; color: rgba(248,113,113,0.5); margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="app">
    <main class="shell">

      <!-- Шапка -->
      <section class="card">
        <div class="card-inner hero-grid">
          <div>
            <div class="altera-logo">
              <div class="altera-logo-mark">A</div>
              <span class="altera-logo-text">Altera Q&A · Админ</span>
            </div>
            <h1 style="font-size:clamp(22px,3.5vw,42px);">Панель управления</h1>
            <p class="subcopy" id="roomLabel">Загрузка…</p>
          </div>
          <div class="links-grid">
            <button class="btn primary" id="openGuestBtn">↗ Гостевая</button>
            <button class="btn ghost"   id="openModBtn">↗ Модератор</button>
            <button class="btn ghost"   id="refreshBtn">↻ Обновить</button>
          </div>
        </div>
      </section>

      <section class="grid-2">

        <!-- Левая колонка -->
        <div class="stack">

          <!-- Состояние комнаты -->
          <section class="card">
            <div class="card-inner stack" style="gap:12px;">
              <h2 class="section-title">Состояние комнаты</h2>
              <div class="toggle-row">
                <div>
                  <div class="toggle-label">Приём вопросов</div>
                  <div class="toggle-sub" id="questionsOpenSub">Загрузка…</div>
                </div>
                <label class="toggle-pill">
                  <input type="checkbox" id="questionsOpenToggle" />
                  <span class="toggle-track"></span>
                </label>
              </div>
              <div class="toggle-row">
                <div>
                  <div class="toggle-label">Премодерация</div>
                  <div class="toggle-sub" id="moderationSub">Загрузка…</div>
                </div>
                <label class="toggle-pill">
                  <input type="checkbox" id="moderationToggle" />
                  <span class="toggle-track"></span>
                </label>
              </div>
              <div class="status" id="status"></div>
            </div>
          </section>

          <!-- Редактор спикера -->
          <section class="card">
            <div class="card-inner stack" style="gap:10px;">
              <h2 class="section-title">Редактор спикера</h2>
              <!-- Кастомный select -->
              <div class="custom-select-wrap" id="speakerSelectWrap">
                <button class="custom-select-btn" id="speakerSelectBtn" type="button">
                  <span id="speakerSelectLabel">Выберите спикера</span>
                  <span class="arrow">▼</span>
                </button>
                <div class="custom-select-dropdown" id="speakerDropdown"></div>
              </div>
              <input class="input" id="nameInput"    placeholder="Имя спикера" />
              <input class="input" id="regaliaInput" placeholder="Должность / регалии" />
              <input class="input" id="topicInput"   placeholder="Тема выступления" />
              <div class="row" style="gap:8px;">
                <button class="btn primary" id="saveBtn"     style="flex:1;">Сохранить</button>
                <button class="btn ghost"   id="activateBtn" style="flex:1;">Сделать активным</button>
              </div>
            </div>
          </section>

          <!-- Список спикеров -->
          <section class="card">
            <div class="card-inner">
              <h2 class="section-title">Спикеры</h2>
              <div class="list" id="speakersList"></div>
            </div>
          </section>

        </div>

        <!-- Правая колонка -->
        <div class="stack">

          <!-- Статистика -->
          <section class="card">
            <div class="card-inner">
              <h2 class="section-title">Статистика</h2>
              <div class="meta-grid">
                <div class="stat"><div class="stat-label">Всего</div>  <div class="stat-value" id="statTotal">0</div></div>
                <div class="stat"><div class="stat-label">Открытые</div><div class="stat-value" id="statOpen">0</div></div>
                <div class="stat"><div class="stat-label">Заданные</div><div class="stat-value" id="statAsked">0</div></div>
                <div class="stat"><div class="stat-label">Скрытые</div> <div class="stat-value" id="statHidden">0</div></div>
              </div>
            </div>
          </section>

          <!-- Вопросы с управлением -->
          <section class="card">
            <div class="card-inner">
              <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:nowrap;">
                <h2 class="section-title" style="margin:0;">Вопросы</h2>
                <div class="row" style="gap:6px; flex-wrap:nowrap;">
                  <button class="filter-tab active" data-filter="all"    style="padding:5px 10px; font-size:11px;">Все</button>
                  <button class="filter-tab" data-filter="open"   style="padding:5px 10px; font-size:11px;">Открытые</button>
                  <button class="filter-tab" data-filter="asked"  style="padding:5px 10px; font-size:11px;">Заданные</button>
                  <button class="filter-tab" data-filter="hidden" style="padding:5px 10px; font-size:11px;">Скрытые</button>
                </div>
              </div>
              <div class="list" id="questionsList"></div>
            </div>
          </section>

        </div>
      </section>

      <!-- Зона опасных действий — внизу страницы -->
      <div class="danger-zone">
        <div class="danger-zone-label">Опасная зона</div>
        <div style="display:flex; flex-direction:column; gap:10px;">
          <div>
            <button class="btn warn" id="clearQuestionsBtn" style="width:100%;">🗑 Очистить все вопросы</button>
            <div id="clearConfirmRow" style="display:none; margin-top:8px;">
              <p style="font-size:12px; color:#fde68a; margin:0 0 8px 0;">Это удалит все вопросы и голоса безвозвратно. Продолжить?</p>
              <div style="display:flex; gap:8px;">
                <button class="btn danger" id="clearConfirmBtn" style="flex:1;">Да, удалить всё</button>
                <button class="btn ghost"  id="clearCancelBtn" style="flex:1;">Отмена</button>
              </div>
            </div>
          </div>
          <button class="btn danger" id="logoutBtn" style="width:100%;">Выйти из аккаунта</button>
        </div>
      </div>

    </main>
  </div>

  <script type="module">
    import {
      supabase, getRoomSlug, getRoomBySlug, listSpeakers, updateSpeaker,
      setActiveSpeaker, setRoomQuestionsOpen, setRoomModeration,
      listQuestions, setQuestionStatus, setQuestionPinned, deleteAllQuestions,
      subscribeRoom, escapeHtml, formatClock
    } from './supabase-qna.js';

    const roomSlug = getRoomSlug();
    const roomLabel       = document.getElementById('roomLabel');
    const statusEl        = document.getElementById('status');
    const nameInput       = document.getElementById('nameInput');
    const regaliaInput    = document.getElementById('regaliaInput');
    const topicInput      = document.getElementById('topicInput');
    const speakersList    = document.getElementById('speakersList');
    const questionsList   = document.getElementById('questionsList');
    const qOpenToggle     = document.getElementById('questionsOpenToggle');
    const modToggle       = document.getElementById('moderationToggle');
    const qOpenSub        = document.getElementById('questionsOpenSub');
    const modSub          = document.getElementById('moderationSub');
    const filterTabs      = Array.from(document.querySelectorAll('.filter-tab'));

    // Кастомный select
    const selectBtn      = document.getElementById('speakerSelectBtn');
    const selectLabel    = document.getElementById('speakerSelectLabel');
    const dropdown       = document.getElementById('speakerDropdown');
    let selectedSpeakerId = null;

    selectBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdown.classList.toggle('open');
    });
    document.addEventListener('click', () => dropdown.classList.remove('open'));

    function buildDropdown(speakers) {
      dropdown.innerHTML = speakers.map(s => `
        <div class="custom-select-option ${String(s.id) === String(selectedSpeakerId) ? 'selected' : ''}"
             data-id="${s.id}" data-name="${escapeHtml(s.name || s.topic || `спикер-${s.id}`)}">
          ${escapeHtml(s.name || s.topic || `спикер-${s.id}`)}
          ${s.is_active ? ' ●' : ''}
        </div>`).join('');
      dropdown.querySelectorAll('.custom-select-option').forEach(opt => {
        opt.addEventListener('click', () => {
          selectedSpeakerId = opt.dataset.id;
          selectLabel.textContent = opt.dataset.name;
          dropdown.classList.remove('open');
          dropdown.querySelectorAll('.custom-select-option').forEach(o => o.classList.remove('selected'));
          opt.classList.add('selected');
          fillFormFromId(selectedSpeakerId);
        });
      });
    }

    const state = { room: null, speakers: [], questions: [], filter: 'all' };
    let unsubscribe = null;
    let _busy = false;
    let _refreshing = false;
    let _pendingRefresh = false;

    boot();

    async function boot() {
      const { data } = await supabase.auth.getSession();
      if (!data.session) {
        location.href = `./login-auth.html?room=${encodeURIComponent(roomSlug)}`;
        return;
      }

      document.getElementById('openGuestBtn').addEventListener('click', () => window.open(`./ask.html?room=${roomSlug}`, '_blank', 'noopener'));
      document.getElementById('openModBtn').addEventListener('click',   () => window.open(`./mod-auth.html?room=${roomSlug}`, '_blank', 'noopener'));
      document.getElementById('refreshBtn').addEventListener('click', () => { _refreshing = false; refresh(); });
      document.getElementById('logoutBtn').addEventListener('click', logout);

      // Двухшаговая очистка вопросов
      const clearBtn        = document.getElementById('clearQuestionsBtn');
      const clearConfirmRow = document.getElementById('clearConfirmRow');
      let clearTimer = null;

      clearBtn.addEventListener('click', () => {
        clearConfirmRow.style.display = 'block';
        clearBtn.style.display = 'none';
        clearTimer = setTimeout(() => resetClearUI(), 8000);
      });
      document.getElementById('clearCancelBtn').addEventListener('click', resetClearUI);
      document.getElementById('clearConfirmBtn').addEventListener('click', async () => {
        clearTimeout(clearTimer);
        try {
          await deleteAllQuestions(state.room.id);
          setStatus('Все вопросы удалены.', 'success');
          await refresh();
        } catch (e) {
          setStatus(e.message || 'Не удалось удалить вопросы.', 'error');
        }
        resetClearUI();
      });
      function resetClearUI() {
        clearTimeout(clearTimer);
        clearConfirmRow.style.display = 'none';
        clearBtn.style.display = 'block';
      }

      filterTabs.forEach(tab => tab.addEventListener('click', () => {
        state.filter = tab.dataset.filter;
        filterTabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        render();
      }));

      qOpenToggle.addEventListener('change', async () => {
        if (_busy) { qOpenToggle.checked = !qOpenToggle.checked; return; }
        await mutate(() => setRoomQuestionsOpen(state.room.id, qOpenToggle.checked),
          qOpenToggle.checked ? 'Приём вопросов открыт.' : 'Приём вопросов закрыт.');
      });
      modToggle.addEventListener('change', async () => {
        if (_busy) { modToggle.checked = !modToggle.checked; return; }
        await mutate(() => setRoomModeration(state.room.id, modToggle.checked),
          modToggle.checked ? 'Премодерация включена.' : 'Премодерация выключена.');
      });

      document.getElementById('saveBtn').addEventListener('click', async () => {
        if (!selectedSpeakerId) return;
        await mutate(() => updateSpeaker(Number(selectedSpeakerId), { name: nameInput.value, regalia: regaliaInput.value, topic: topicInput.value }), 'Данные спикера сохранены.');
      });
      document.getElementById('activateBtn').addEventListener('click', async () => {
        if (!selectedSpeakerId) return;
        await mutate(() => setActiveSpeaker(state.room.id, Number(selectedSpeakerId)), 'Активный спикер обновлён.');
      });

      await refresh();
      if (unsubscribe) unsubscribe();
      unsubscribe = subscribeRoom(state.room.id, refresh);
    }

    async function refresh() {
      if (_refreshing) { _pendingRefresh = true; return; }
      _refreshing = true;
      _pendingRefresh = false;
      try {
        state.room      = await getRoomBySlug(roomSlug);
        state.speakers  = await listSpeakers(state.room.id);
        state.questions = await listQuestions(state.room.id, null, { includeHidden: true, includeAsked: true });
        render();
      } finally {
        _refreshing = false;
        if (_pendingRefresh) refresh();
      }
    }

    function render() {
      roomLabel.textContent = `Комната: ${state.room?.slug || roomSlug}`;

      qOpenToggle.checked = Boolean(state.room?.is_questions_open);
      modToggle.checked   = Boolean(state.room?.moderation_enabled);
      qOpenSub.textContent = state.room?.is_questions_open ? 'Гости могут задавать вопросы' : 'Приём приостановлен';
      modSub.textContent   = state.room?.moderation_enabled ? 'Вопросы проходят проверку' : 'Вопросы публикуются сразу';

      // Если выбранного спикера ещё нет — берём активного
      if (!selectedSpeakerId) {
        const active = state.speakers.find(s => s.is_active);
        if (active) {
          selectedSpeakerId = String(active.id);
          selectLabel.textContent = active.name || active.topic || `спикер-${active.id}`;
        }
      }
      buildDropdown(state.speakers);
      fillFormFromId(selectedSpeakerId);

      // Список спикеров
      speakersList.innerHTML = state.speakers.length
        ? state.speakers.map(s => {
            const initials = (s.name || '?').trim().split(/\s+/).slice(0,2).map(w => w[0]).join('').toUpperCase();
            return `
              <div class="speaker-row ${s.is_active ? 'active' : ''}">
                <div class="speaker-avatar">${initials}</div>
                <div class="speaker-info">
                  <div class="speaker-name">${escapeHtml(s.name || 'Без имени')} ${s.is_active ? '<span class="badge open" style="font-size:9px;padding:3px 8px;">ACTIVE</span>' : ''}</div>
                  <div class="speaker-meta">${escapeHtml([s.regalia, s.topic].filter(Boolean).join(' · ') || '—')}</div>
                </div>
              </div>`;
          }).join('')
        : '<div class="empty">Список спикеров пуст.</div>';

      // Статистика
      document.getElementById('statTotal').textContent  = state.questions.length;
      document.getElementById('statOpen').textContent   = state.questions.filter(q => q.status === 'open').length;
      document.getElementById('statAsked').textContent  = state.questions.filter(q => q.status === 'asked').length;
      document.getElementById('statHidden').textContent = state.questions.filter(q => q.status === 'hidden').length;

      // Вопросы с управлением
      const speakerMap = new Map(state.speakers.map(s => [String(s.id), s]));
      const rows = state.filter === 'all' ? state.questions : state.questions.filter(q => q.status === state.filter);

      questionsList.innerHTML = rows.length
        ? rows.slice(0, 30).map(item => {
            const sp     = speakerMap.get(String(item.speaker_id));
            const author = [item.author_name, item.author_company].filter(Boolean).join(' · ');
            const st     = item.status;
            const isAsked  = st === 'asked';
            const isHidden = st === 'hidden';
            const isPinned = item.is_pinned;
            return `
              <div class="question-card" style="${isAsked ? 'opacity:0.65;' : ''}">
                <div style="display:flex; justify-content:space-between; gap:10px; align-items:flex-start;">
                  <div class="question-text" style="font-size:14px;">${escapeHtml(item.text)}</div>
                  <div style="display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;">
                    ${isPinned ? '<span class="badge pinned">PIN</span>' : ''}
                    <span class="badge ${isAsked ? 'asked' : isHidden ? 'hidden' : 'open'}">${isAsked ? 'задан' : isHidden ? 'скрыт' : 'открыт'}</span>
                  </div>
                </div>
                <div class="question-meta">
                  ${sp?.name ? escapeHtml(sp.name) + ' · ' : ''}${author ? escapeHtml(author) + ' · ' : ''}${formatClock(item.created_at)} · +${item.votes_count || 0}
                </div>
                <div class="question-actions">
                  ${!isAsked  ? `<button class="btn primary" style="padding:7px 12px;font-size:11px;" data-action="ask"  data-id="${item.id}">✓ Задал</button>` : ''}
                  ${!isHidden ? `<button class="btn warn"    style="padding:7px 12px;font-size:11px;" data-action="hide" data-id="${item.id}">Скрыть</button>` : ''}
                  ${isHidden || isAsked ? `<button class="btn ghost" style="padding:7px 12px;font-size:11px;" data-action="open" data-id="${item.id}">Вернуть</button>` : ''}
                  <button class="btn ghost" style="padding:7px 12px;font-size:11px;" data-action="pin" data-id="${item.id}" data-pinned="${isPinned ? '1' : '0'}">${isPinned ? 'Открепить' : 'Закрепить'}</button>
                </div>
              </div>`;
          }).join('')
        : '<div class="empty">Вопросов нет.</div>';

      questionsList.querySelectorAll('[data-action]').forEach(btn => btn.addEventListener('click', async () => {
        try {
          const id = Number(btn.dataset.id);
          if (btn.dataset.action === 'ask')  await setQuestionStatus(id, 'asked');
          if (btn.dataset.action === 'hide') await setQuestionStatus(id, 'hidden');
          if (btn.dataset.action === 'open') await setQuestionStatus(id, 'open');
          if (btn.dataset.action === 'pin')  await setQuestionPinned(id, btn.dataset.pinned !== '1');
          await refresh();
        } catch (e) {
          setStatus(e.message || 'Ошибка', 'error');
        }
      }));
    }

    function fillFormFromId(id) {
      const s = state.speakers.find(sp => String(sp.id) === String(id));
      nameInput.value    = s?.name    || '';
      regaliaInput.value = s?.regalia || '';
      topicInput.value   = s?.topic   || '';
    }

    async function mutate(fn, successMsg) {
      _busy = true;
      try {
        await fn();
        setStatus(successMsg, 'success');
        await refresh();
      } catch (e) {
        setStatus(e.message || 'Не удалось выполнить действие.', 'error');
      } finally {
        _busy = false;
      }
    }

    async function logout() {
      await supabase.auth.signOut();
      location.href = `./login-auth.html?room=${encodeURIComponent(roomSlug)}`;
    }

    function setStatus(message, type = '') {
      statusEl.textContent = message;
      statusEl.className = `status ${type}`.trim();
    }
  </script>
</body>
</html>
