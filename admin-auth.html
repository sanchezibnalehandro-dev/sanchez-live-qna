<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Q&A Admin Auth</title>
  <link rel="stylesheet" href="./theme.css" />
</head>
<body>
  <div class="app">
    <main class="shell">
      <section class="card"><div class="card-inner hero-grid">
        <div>
          <div class="eyebrow"><span class="live-dot"></span><span id="roomLabel">LIVE ROOM</span></div>
          <h1>Админка Q&A Auth</h1>
          <p class="subcopy">Защищённая админка на Supabase Auth. После логина доступны управление комнатой, спикерами и вопросами.</p>
        </div>
        <div class="links-grid">
          <button class="btn primary" id="openGuestBtn">Открыть guest</button>
          <button class="btn ghost" id="openModBtn">Открыть moderator</button>
          <button class="btn danger" id="logoutBtn">Выйти</button>
        </div>
      </div></section>

      <section class="grid-2">
        <div class="stack">
          <section class="card"><div class="card-inner stack">
            <h2 class="section-title">Состояние комнаты</h2>
            <div class="row"><button class="btn primary" id="openBtn">Открыть вопросы</button><button class="btn warn" id="closeBtn">Закрыть вопросы</button></div>
            <div class="row"><button class="btn ghost" id="moderationOnBtn">Премодерация ON</button><button class="btn ghost" id="moderationOffBtn">Премодерация OFF</button></div>
            <div class="status" id="status"></div>
          </div></section>

          <section class="card"><div class="card-inner stack">
            <h2 class="section-title">Редактор активного спикера</h2>
            <select class="select" id="speakerSelect"></select>
            <input class="input" id="nameInput" placeholder="Имя" />
            <input class="input" id="regaliaInput" placeholder="Регалии" />
            <input class="input" id="topicInput" placeholder="Тема" />
            <input class="input" id="fallbackInput" placeholder="Fallback label" />
            <div class="row"><button class="btn primary" id="saveBtn">Сохранить поля</button><button class="btn ghost" id="activateBtn">Сделать активным</button></div>
          </div></section>
        </div>

        <div class="stack">
          <section class="card"><div class="card-inner">
            <h2 class="section-title">Последние вопросы</h2>
            <div class="list" id="questionsList"></div>
          </div></section>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import { supabase, getRoomSlug, getRoomBySlug, listSpeakers, updateSpeaker, setActiveSpeaker, setRoomQuestionsOpen, setRoomModeration, listQuestions, subscribeRoom, escapeHtml, formatClock } from './supabase-qna.js';

    const roomSlug = getRoomSlug();
    const roomLabel = document.getElementById('roomLabel');
    const statusEl = document.getElementById('status');
    const speakerSelect = document.getElementById('speakerSelect');
    const nameInput = document.getElementById('nameInput');
    const regaliaInput = document.getElementById('regaliaInput');
    const topicInput = document.getElementById('topicInput');
    const fallbackInput = document.getElementById('fallbackInput');
    const questionsList = document.getElementById('questionsList');

    const state = { room: null, speakers: [], questions: [] };
    let unsubscribe = null;

    boot();

    async function boot() {
      const { data } = await supabase.auth.getSession();
      if (!data.session) {
        location.href = `./login-auth.html?room=${encodeURIComponent(roomSlug)}`;
        return;
      }
      roomLabel.textContent = `LIVE ROOM · ${roomSlug}`;
      document.getElementById('openGuestBtn').addEventListener('click', () => window.open(`./ask.html?room=${roomSlug}`, '_blank', 'noopener'));
      document.getElementById('openModBtn').addEventListener('click', () => window.open(`./mod-auth.html?room=${roomSlug}`, '_blank', 'noopener'));
      document.getElementById('logoutBtn').addEventListener('click', logout);
      document.getElementById('openBtn').addEventListener('click', async () => mutate(async () => setRoomQuestionsOpen(state.room.id, true), 'Приём вопросов открыт.'));
      document.getElementById('closeBtn').addEventListener('click', async () => mutate(async () => setRoomQuestionsOpen(state.room.id, false), 'Приём вопросов закрыт.'));
      document.getElementById('moderationOnBtn').addEventListener('click', async () => mutate(async () => setRoomModeration(state.room.id, true), 'Премодерация включена.'));
      document.getElementById('moderationOffBtn').addEventListener('click', async () => mutate(async () => setRoomModeration(state.room.id, false), 'Премодерация выключена.'));
      document.getElementById('saveBtn').addEventListener('click', async () => {
        const id = Number(speakerSelect.value);
        await mutate(async () => updateSpeaker(id, { name: nameInput.value, regalia: regaliaInput.value, topic: topicInput.value, fallback_label: fallbackInput.value }), 'Данные спикера сохранены.');
      });
      document.getElementById('activateBtn').addEventListener('click', async () => {
        const id = Number(speakerSelect.value);
        await mutate(async () => setActiveSpeaker(state.room.id, id), 'Активный спикер обновлён.');
      });
      speakerSelect.addEventListener('change', fillFormFromSelect);
      await refresh();
      if (unsubscribe) unsubscribe();
      unsubscribe = subscribeRoom(state.room.id, refresh);
    }

    async function refresh() {
      state.room = await getRoomBySlug(roomSlug);
      state.speakers = await listSpeakers(state.room.id);
      state.questions = await listQuestions(state.room.id, null, { includeHidden: true, includeAsked: true });
      render();
    }

    function render() {
      speakerSelect.innerHTML = state.speakers.map((speaker) => `<option value="${speaker.id}" ${speaker.is_active ? 'selected' : ''}>${escapeHtml(speaker.name || speaker.topic || `speaker-${speaker.id}`)}</option>`).join('');
      fillFormFromSelect();
      questionsList.innerHTML = state.questions.length ? state.questions.slice(0, 16).map((item) => `
        <div class="question-card">
          <div class="row" style="justify-content:space-between; align-items:flex-start;">
            <div class="question-text">${escapeHtml(item.text)}</div>
            <span class="badge ${item.status === 'asked' ? 'asked' : item.status === 'hidden' ? 'hidden' : 'open'}">${item.status}</span>
          </div>
          <div class="question-meta">${formatClock(item.created_at)} · +1: ${item.votes_count || 0}</div>
        </div>`).join('') : '<div class="empty">Пока вопросов нет.</div>';
    }

    function fillFormFromSelect() {
      const selected = state.speakers.find((speaker) => String(speaker.id) === String(speakerSelect.value));
      nameInput.value = selected?.name || '';
      regaliaInput.value = selected?.regalia || '';
      topicInput.value = selected?.topic || '';
      fallbackInput.value = selected?.fallback_label || state.room?.fallback_label || 'Вопросы спикеру';
    }

    async function mutate(fn, successMessage) {
      try {
        await fn();
        setStatus(successMessage, 'success');
        await refresh();
      } catch (error) {
        setStatus(error.message || 'Не удалось выполнить действие.', 'error');
      }
    }

    async function logout() {
      await supabase.auth.signOut();
      location.href = `./login-auth.html?room=${encodeURIComponent(roomSlug)}`;
    }

    function setStatus(message, type = '') {
      statusEl.textContent = message;
      statusEl.className = `status ${type}`.trim();
    }
  </script>
</body>
</html>
