<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title></title>
  <link rel="stylesheet" href="./theme.css" />
  <link rel="stylesheet" data-brand-stylesheet />
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const room = (params.get('room') || '').trim();
      const event = (params.get('event') || '').trim();
      const isTasigo = room.startsWith('tasigo-esg-') || event.startsWith('tasigo-esg-');
      document.querySelector('[data-brand-stylesheet]').href = isTasigo ? './brands/tasigo-esg.css' : './brands/sanchez.css';
    })();
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap');

    .moderator-console { font-family: var(--font-console); font-variant-numeric: tabular-nums lining-nums; }
    .moderator-console h1, .moderator-console h2, .moderator-console .section-title { font-family: inherit; }
    .moderator-shell { max-width: 1040px; gap: 12px; }
    .moderator-live .card-inner { padding: 15px 18px; }
    .moderator-live-grid { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; }
    .moderator-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
    .moderator-brand .brand-logo-mark { width: 30px; height: 30px; border-radius: 9px; font-size: 14px; }
    .moderator-brand-label { min-width: 0; color: var(--muted); font-size: clamp(8px, 1.4vw, 10px); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
    .live-speaker-label { display: flex; align-items: center; gap: 7px; color: var(--green); font-size: 10px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    .live-speaker-label::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
    .moderator-live h1 { margin: 4px 0 0; color: var(--text); background: none; -webkit-text-fill-color: var(--text); font-size: clamp(21px, 3vw, 31px); font-weight: 800; letter-spacing: -.035em; line-height: 1.12; }
    .moderator-live .subcopy { margin: 4px 0 0; font-size: 12px; line-height: 1.45; }
    .live-statuses { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 7px; }
    .room-chip, .live-chip { display: inline-flex; align-items: center; min-height: 30px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--border-2); background: var(--surface-2); color: var(--color-info-text); font-size: 10px; font-weight: 800; letter-spacing: .04em; white-space: nowrap; }
    .room-chip.open { background: var(--color-success-soft); border-color: color-mix(in srgb, var(--color-success) 22%, transparent); color: var(--color-success); }
    .room-chip.closed { background: var(--color-warning-soft); border-color: color-mix(in srgb, var(--color-warning) 22%, transparent); color: var(--color-warning-text); }
    .live-chip.warn { color: var(--color-warning-text); border-color: color-mix(in srgb, var(--color-warning) 20%, transparent); }
    .live-chip .live-dot { width: 6px; height: 6px; margin-right: 6px; border-radius: 50%; background: var(--green); }
    .live-chip.connecting .live-dot { background: var(--yellow); }
    .live-chip.offline .live-dot { background: var(--danger); }

    .moderator-queue .card-inner { padding: 16px; }
    .queue-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 13px; }
    .queue-title { margin: 0; color: var(--text); font-size: 17px; font-weight: 800; letter-spacing: -.02em; }
    .queue-title span { color: var(--color-accent-text); }
    .queue-subtitle { margin: 3px 0 0; color: var(--muted); font-size: 11px; }
    .focus-mode-btn { min-height: 38px; padding: 0 11px; border-radius: 10px; font-size: 11px; }
    .filter-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
    .filter-tab { display: grid; justify-items: start; align-content: center; min-height: 76px; padding: 10px 12px; border: 1px solid var(--border-2); border-radius: 13px; background: var(--surface-2); color: var(--muted); font-family: inherit; cursor: pointer; text-align: left; transition: border-color .15s, background .15s, transform .15s; }
    .filter-tab:focus-visible, .focus-mode-btn:focus-visible { outline: 3px solid var(--color-focus-ring); outline-offset: 2px; }
    .filter-tab.active { border-color: color-mix(in srgb, var(--color-accent-hover) 58%, transparent); background: color-mix(in srgb, var(--color-accent) 22%, transparent); box-shadow: inset 3px 0 0 var(--color-accent-hover); color: var(--color-accent-active-text); }
    .filter-count { color: var(--text); font-size: 27px; font-weight: 900; letter-spacing: -.065em; line-height: .95; }
    .filter-tab.active .filter-count { color: var(--color-text-on-accent); }
    .filter-label { margin-top: 7px; font-size: 12px; font-weight: 800; letter-spacing: .06em; line-height: 1.2; text-transform: uppercase; }
    .filter-tab.pending .filter-count { color: var(--color-warning-text); }
    .moderator-status { margin: 10px 1px 0; min-height: 0; }
    .question-list { margin-top: 14px; border-top: 1px solid var(--border-2); }
    .moderator-console #questionsList { display: grid; gap: 0; }
    .moderator-console .question-card { padding: 17px 2px; border: 0; border-bottom: 1px solid var(--border-2); border-radius: 0; background: transparent; }
    .moderator-console .question-card:last-child { border-bottom: 0; }
    .moderator-console .question-card.is-pinned { background: linear-gradient(90deg, color-mix(in srgb, var(--color-accent) 10%, transparent), transparent 42%); }
    .moderator-console .question-card.is-asked { opacity: .78; }
    .moderator-console .question-card.is-pending { background: linear-gradient(90deg, color-mix(in srgb, var(--color-warning) 6%, transparent), transparent 42%); }
    .question-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .question-main { min-width: 0; flex: 1; }
    .moderator-console .question-text { font-size: clamp(18px, 2.35vw, 22px); font-weight: 600; line-height: 1.45; letter-spacing: -.015em; }
    .moderator-console .question-meta { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 8px; font-size: 11px; line-height: 1.4; }
    .question-meta-speaker { color: var(--color-accent-text); font-weight: 700; }
    .question-state { display: grid; justify-items: end; gap: 5px; flex: 0 0 auto; }
    .question-state .badge { padding: 4px 7px; font-size: 9px; }
    .votes-bar { display: flex; align-items: center; gap: 7px; margin-top: 9px; }
    .votes-bar-fill { min-width: 4px; height: 3px; border-radius: 999px; background: linear-gradient(90deg, var(--color-accent), var(--color-accent-hover)); }
    .votes-bar-count { color: var(--color-accent-text); font-size: 11px; font-weight: 700; }
    .moderator-console .question-actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 8px; margin-top: 14px; }
    .moderator-console .question-actions .btn { min-height: 44px; padding: 10px 12px; font-size: 11px; font-weight: 800; }
    .moderator-console .question-actions .btn.primary { box-shadow: 0 3px 14px color-mix(in srgb, var(--color-accent) 30%, transparent); }
    .moderator-console .empty { margin: 18px 0 2px; }
    .focus-questions .moderator-live { display: none; }
    .focus-questions .moderator-shell { max-width: 1120px; }

    /* Forest pass: stronger live context and scannable moderation states. */
    .moderator-kicker {
      margin-bottom: 9px;
      color: var(--color-accent-text);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
    }
    .moderator-live { border-color: var(--color-accent-border); }
    .moderator-console { --role-density: 1; }
    .room-chip, .live-chip { min-height: 34px; }
    .moderator-console #questionsList { gap: 12px; }
    .moderator-console .question-list { border-top: 0; }
    .moderator-console .question-card {
      padding: 16px;
      border: 1px solid var(--color-border-subtle);
      border-radius: var(--radius-lg);
      background: var(--color-bg-elevated);
    }
    .moderator-console .question-card:last-child { border-bottom: 1px solid var(--color-border-subtle); }
    .moderator-console .question-card.is-pinned { border-color: var(--color-accent-border); }
    .moderator-console .question-card.is-pending { border-color: color-mix(in srgb, var(--color-warning) 38%, transparent); }
    .moderator-console .question-actions .btn { min-height: 46px; }
    @media (hover: hover) {
      .filter-tab:hover { border-color: var(--color-focus-ring); background: color-mix(in srgb, var(--color-accent-hover) 9%, transparent); }
    }
    @media (max-width: 680px) {
      .moderator-console .question-card { padding: 14px; }
      .live-statuses { width: 100%; }
    }

    @media (max-width: 820px) { .filter-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 680px) { .app { padding: 12px 12px 28px; } .card { border-radius: 17px; } .moderator-live .card-inner, .moderator-queue .card-inner { padding: 14px; } .moderator-live-grid { grid-template-columns: 1fr; gap: 11px; } .live-statuses { justify-content: flex-start; } .filter-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .filter-tab { min-height: 74px; } .question-state { max-width: 88px; } }
    @media (max-width: 420px) { .queue-head { align-items: flex-start; flex-direction: column; } .focus-mode-btn { width: 100%; } .moderator-console .question-actions { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="is-booting">
  <div class="bootstrap-screen" id="bootstrapScreen" role="status" aria-live="polite">
    <div class="bootstrap-card">
      <div class="bootstrap-brand"><div class="brand-logo-mark" data-brand-mark></div><div class="bootstrap-brand-copy"><strong data-brand-name></strong><span data-brand-product></span></div></div>
      <p class="bootstrap-message" id="bootstrapMessage">Загрузка…</p>
    </div>
  </div>
  <div class="moderator-console app" id="appShell" inert aria-hidden="true">
    <main class="moderator-shell shell">
      <section class="card moderator-live">
        <div class="card-inner moderator-live-grid">
          <div>
            <div class="moderator-kicker">LIVE MODERATION</div>
            <div class="moderator-brand"><div class="brand-logo-mark" data-brand-mark></div><span class="moderator-brand-label"><span data-brand-name></span> · Модератор</span></div>
            <div class="live-speaker-label" id="liveContextLabel">Сейчас в эфире</div>
            <h1 id="speakerName">Загрузка…</h1>
            <p class="subcopy" id="speakerMeta"></p>
          </div>
          <div class="live-statuses">
            <span id="roomChip" class="room-chip closed">Загрузка…</span>
            <span id="moderationChip" class="live-chip warn">Премодерация</span>
            <span class="live-chip connecting" id="realtimeChip"><i class="live-dot"></i><span id="realtimeStatus">Подключение…</span></span>
          </div>
        </div>
      </section>

      <section class="card moderator-queue">
        <div class="card-inner">
          <div class="queue-head">
            <div><h2 class="queue-title">Вопросы · <span id="countLabel">0</span></h2><p class="queue-subtitle">Выберите очередь и обработайте следующий вопрос</p></div>
            <div class="question-header-actions"><div class="question-sort" role="group" aria-label="Сортировка вопросов"><button class="question-sort-btn active" type="button" data-sort="votes" aria-pressed="true">По голосам</button><button class="question-sort-btn" type="button" data-sort="newest" aria-pressed="false">Новые</button></div><button class="btn ghost focus-mode-btn" id="focusModeBtn" type="button" aria-pressed="false">Только вопросы</button></div>
          </div>
          <div class="filter-grid" aria-label="Очереди вопросов">
            <button class="filter-tab active" data-filter="all"><span class="filter-count" id="sAll">0</span><span class="filter-label">Все</span></button>
            <button class="filter-tab pending" data-filter="pending"><span class="filter-count" id="sPending">0</span><span class="filter-label">На модерации</span></button>
            <button class="filter-tab" data-filter="open"><span class="filter-count" id="sOpen">0</span><span class="filter-label">Открытые</span></button>
            <button class="filter-tab" data-filter="asked"><span class="filter-count" id="sAsked">0</span><span class="filter-label">Заданные</span></button>
            <button class="filter-tab" data-filter="hidden"><span class="filter-count" id="sHidden">0</span><span class="filter-label">Скрытые</span></button>
          </div>
          <div class="status moderator-status" id="status"></div>
          <div class="question-list"><div class="list" id="questionsList"></div></div>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import { applyBrandIdentity, getBrandForRoute } from './brand.js';
    import {
      supabase, DEFAULT_ROOM_SLUG, getRoomSlug, getEventKey, getRoomBySlug, getCurrentEventRoom, listEventRooms, getActiveSpeaker, listQuestions,
      moderateQuestionStatus, moderateQuestionPinned, subscribeRoom, subscribeEvent, escapeHtml, formatClock
    } from './supabase-qna.js';

    const eventKey = getEventKey();
    const requestedRoomSlug = getRoomSlug();
    applyBrandIdentity('moderator', getBrandForRoute(requestedRoomSlug, eventKey));
    const appShell = document.getElementById('appShell');
    const bootstrapScreen = document.getElementById('bootstrapScreen');
    const bootstrapMessage = document.getElementById('bootstrapMessage');
    const sortButtons = Array.from(document.querySelectorAll('[data-sort]'));
    const sortScope = eventKey ? `event:${eventKey}` : `room:${requestedRoomSlug}`;
    const sortModeKey = `sanchez-live-sort:moderator:${sortScope}`;
    const roomChip     = document.getElementById('roomChip');
    const moderationChip = document.getElementById('moderationChip');
    const liveContextLabel = document.getElementById('liveContextLabel');
    const speakerName  = document.getElementById('speakerName');
    const speakerMeta  = document.getElementById('speakerMeta');
    const questionsList = document.getElementById('questionsList');
    const statusEl     = document.getElementById('status');
    const countLabel   = document.getElementById('countLabel');
    const filterTabs   = Array.from(document.querySelectorAll('.filter-tab'));
    const focusModeBtn = document.getElementById('focusModeBtn');
    const focusScope = eventKey ? `event:${eventKey}` : requestedRoomSlug;
    const focusModeKey = !eventKey && requestedRoomSlug === DEFAULT_ROOM_SLUG
      ? 'sanchez-live-moderator-focus-mode'
      : `sanchez-live-moderator-focus-mode:${focusScope}`;

    function finishBootstrap() {
      appShell.removeAttribute('inert');
      appShell.removeAttribute('aria-hidden');
      document.body.classList.remove('is-booting');
      document.body.classList.add('is-ready');
    }

    function showBootstrapError(error) {
      console.error('Moderator initial load failed', error);
      bootstrapScreen.classList.add('is-error');
      bootstrapScreen.setAttribute('role', 'alert');
      bootstrapMessage.textContent = error?.message || 'Не удалось загрузить данные. Обновите страницу и попробуйте снова.';
    }

    function loadSortMode() {
      try {
        const value = localStorage.getItem(sortModeKey);
        return value === 'newest' ? 'newest' : 'votes';
      } catch {
        return 'votes';
      }
    }

    function persistSortMode(mode) {
      try { localStorage.setItem(sortModeKey, mode); } catch {}
    }

    function sortQuestions(questions, mode) {
      return [...questions].sort((left, right) => {
        const pinned = Number(Boolean(right.is_pinned)) - Number(Boolean(left.is_pinned));
        if (pinned) return pinned;
        if (mode === 'votes') {
          const votes = Number(right.votes_count || 0) - Number(left.votes_count || 0);
          if (votes) return votes;
        }
        return (Date.parse(right.created_at) || 0) - (Date.parse(left.created_at) || 0);
      });
    }

    const state = { room: null, speaker: null, questions: [], filter: 'all', sortMode: loadSortMode() };
    let unsubscribeRoom = null;
    let unsubscribeEvent = null;
    let subscribedRoomId = null;
    const realtimeChannels = { room: 'CONNECTING', event: eventKey ? 'CONNECTING' : 'SUBSCRIBED' };
    let maxVotes = 1;
    let _refreshing = false;
    let _pendingRefresh = false;
    const pendingQuestionActions = new Set();

    function setFocusMode(enabled) {
      document.body.classList.toggle('focus-questions', enabled);
      focusModeBtn.setAttribute('aria-pressed', String(enabled));
      focusModeBtn.textContent = enabled ? 'Показать эфир' : 'Только вопросы';
      localStorage.setItem(focusModeKey, String(enabled));
    }

    try {
      setFocusMode(localStorage.getItem(focusModeKey) === 'true');
    } catch {
      document.body.classList.remove('focus-questions');
    }

    void boot().catch(showBootstrapError);

    async function boot() {
      const { data, error: authError } = await supabase.auth.getSession();
      if (authError) {
        showBootstrapError(authError);
        return;
      }
      if (!data.session) {
        const route = eventKey
          ? `event=${encodeURIComponent(eventKey)}`
          : `room=${encodeURIComponent(requestedRoomSlug)}`;
        location.href = `./login-auth.html?${route}&next=moderator`;
        return;
      }

      filterTabs.forEach((tab) => tab.addEventListener('click', () => {
        state.filter = tab.dataset.filter;
        filterTabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        render();
      }));
      focusModeBtn.addEventListener('click', () => {
        setFocusMode(!document.body.classList.contains('focus-questions'));
      });
      sortButtons.forEach(button => button.addEventListener('click', () => {
        const mode = button.dataset.sort;
        if (mode !== 'votes' && mode !== 'newest') return;
        state.sortMode = mode;
        persistSortMode(mode);
        if (state.room) render();
      }));

      try {
        if (eventKey) {
          unsubscribeEvent = subscribeEvent(eventKey, queueRefresh, (status) => setRealtimeChannelStatus('event', status));
        }
        await refresh();
        finishBootstrap();
      } catch (e) {
        showBootstrapError(e);
      }
    }

    function renderTerminalRouteError(error) {
      const noCurrentSession = error?.code === 'CURRENT_SESSION_NOT_SET';
      const invalidEvent = error?.code === 'EVENT_NOT_FOUND';
      const invalidRoom = error?.code === 'PGRST116' || String(error?.message || '').includes('JSON object requested');
      if (!noCurrentSession && !invalidEvent && !invalidRoom) return false;

      unsubscribeRoom?.();
      unsubscribeRoom = null;
      subscribedRoomId = null;
      realtimeChannels.room = 'SUBSCRIBED';
      state.room = null;
      state.speaker = null;
      state.questions = [];

      speakerName.textContent = invalidEvent
        ? 'Мероприятие не найдено'
        : noCurrentSession ? 'Сессия ещё не выбрана' : 'Комната не найдена';
      speakerMeta.textContent = invalidEvent
        ? `Мероприятие «${eventKey}» не существует. Проверьте ссылку.`
        : noCurrentSession
          ? 'Для этого мероприятия пока не назначена текущая сессия.'
          : `Комната «${requestedRoomSlug}» не существует. Проверьте ссылку.`;
      roomChip.className = 'room-chip closed';
      roomChip.textContent = 'Нет активной сессии';
      moderationChip.textContent = 'Премодерация · —';
      countLabel.textContent = '0';
      questionsList.innerHTML = '<div class="empty">Очередь недоступна.</div>';
      filterTabs.forEach(tab => {
        const counter = tab.querySelector('.filter-count');
        if (counter) counter.textContent = '0';
      });
      document.getElementById('realtimeChip').hidden = true;
      return true;
    }

    function reportRefreshError(error) {
      if (renderTerminalRouteError(error)) return;
      console.error('Moderator data refresh failed', error);
      setStatus('Не удалось обновить данные. Проверьте соединение.', 'error');
    }

    function queueRefresh() {
      void refresh().catch(reportRefreshError);
    }

    async function resolveRoom() {
      if (!eventKey) return getRoomBySlug(requestedRoomSlug);
      const room = await getCurrentEventRoom(eventKey);
      if (room) return room;
      const eventRooms = await listEventRooms(eventKey);
      const error = new Error(eventRooms.length
        ? 'Для мероприятия не выбрана текущая сессия.'
        : 'Мероприятие не найдено.');
      error.code = eventRooms.length ? 'CURRENT_SESSION_NOT_SET' : 'EVENT_NOT_FOUND';
      throw error;
    }

    function setRealtimeChannelStatus(channel, status) {
      realtimeChannels[channel] = status;
      const statuses = Object.values(realtimeChannels);
      if (statuses.some(value => value === 'CHANNEL_ERROR' || value === 'TIMED_OUT' || value === 'CLOSED')) {
        setRealtimeStatus('CHANNEL_ERROR');
      } else if (statuses.every(value => value === 'SUBSCRIBED')) {
        setRealtimeStatus('SUBSCRIBED');
      } else {
        setRealtimeStatus('CONNECTING');
      }
    }

    function ensureRoomSubscription(roomId) {
      if (subscribedRoomId === roomId && unsubscribeRoom) return;
      unsubscribeRoom?.();
      subscribedRoomId = roomId;
      realtimeChannels.room = 'CONNECTING';
      setRealtimeChannelStatus('room', 'CONNECTING');
      unsubscribeRoom = subscribeRoom(roomId, queueRefresh, (status) => setRealtimeChannelStatus('room', status));
    }

    async function refresh() {
      if (_refreshing) { _pendingRefresh = true; return; }
      _refreshing = true;
      _pendingRefresh = false;
      try {
        const nextRoom = await resolveRoom();
        const roomChanged = state.room?.id !== nextRoom.id;
        state.room = nextRoom;
        if (roomChanged) applyBrandIdentity('moderator', getBrandForRoute(state.room.slug, eventKey));
        ensureRoomSubscription(state.room.id);
        const isPanel = state.room.mode === 'panel';
        state.speaker = isPanel ? null : await getActiveSpeaker(state.room.id);
        state.questions = await listQuestions(state.room.id, isPanel ? null : state.speaker?.id, { includeHidden: true, includeAsked: true, includePending: true });
        maxVotes = Math.max(1, ...state.questions.map(q => q.votes_count || 0));
        render();
      } catch (error) {
        if (!renderTerminalRouteError(error)) throw error;
      } finally {
        _refreshing = false;
        if (_pendingRefresh) {
          _pendingRefresh = false;
          queueRefresh();
        }
      }
    }

    function render() {
      document.getElementById('realtimeChip').hidden = false;
      sortButtons.forEach(button => {
        const active = button.dataset.sort === state.sortMode;
        button.classList.toggle('active', active);
        button.setAttribute('aria-pressed', String(active));
      });
      const isPanel = state.room?.mode === 'panel';
      const isLiveRoom = !state.room?.event_key || state.room?.is_current_session === true;
      const fallback = state.room?.fallback_label || 'Вопросы спикеру';
      liveContextLabel.textContent = isPanel
        ? (isLiveRoom ? 'Сессия' : 'Сессия не в эфире')
        : 'Сейчас в эфире';
      speakerName.textContent = isPanel
        ? (state.room?.title || fallback)
        : (state.speaker?.name || state.speaker?.fallback_label || fallback);
      const metadata = isPanel
        ? [state.room?.moderator_name && `Модератор: ${state.room.moderator_name}`, state.room?.moderator_regalia]
        : [state.speaker?.regalia, state.speaker?.topic];
      speakerMeta.innerHTML = metadata
        .filter(Boolean)
        .map(value => `<span>${escapeHtml(value)}</span>`)
        .join('<br>') || (isPanel ? 'Модератор сессии' : 'Активный спикер не задан');

      // Статус комнаты
      const isOpen = isLiveRoom && state.room?.is_questions_open;
      roomChip.className = `room-chip ${isOpen ? 'open' : 'closed'}`;
      roomChip.textContent = isLiveRoom ? (isOpen ? 'Приём открыт' : 'Приём закрыт') : 'Не в эфире';
      const moderationEnabled = Boolean(state.room?.moderation_enabled);
      moderationChip.className = `live-chip ${moderationEnabled ? 'warn' : ''}`.trim();
      moderationChip.textContent = moderationEnabled ? 'Премодерация · вкл' : 'Премодерация · выкл';

      // Статистика
      const all = state.questions;
      const pendingQs = all.filter(q => q.status === 'pending');
      document.getElementById('sAll').textContent    = all.length;
      document.getElementById('sPending').textContent = pendingQs.length;
      document.getElementById('sOpen').textContent   = all.filter(q => q.status === 'open').length;
      document.getElementById('sAsked').textContent  = all.filter(q => q.status === 'asked').length;
      document.getElementById('sHidden').textContent = all.filter(q => q.status === 'hidden').length;

      // Фильтрация
      const filteredRows = state.filter === 'all'
        ? all
        : all.filter(q => q.status === state.filter);
      const rows = sortQuestions(filteredRows, state.sortMode);

      countLabel.textContent = rows.length;

      if (!rows.length) {
        const emptyMessages = {
          all:     { icon: '💬', title: 'Вопросов ещё нет',   sub: 'Сессия только начинается' },
          open:    { icon: '📋', title: 'Открытых нет',       sub: 'Все вопросы уже обработаны' },
          pending: { icon: '✓',  title: 'Всё проверено',      sub: 'Нет вопросов на модерации' },
          asked:   { icon: '🎤', title: 'Ещё не спросили',    sub: 'Помечайте заданные вопросы' },
          hidden:  { icon: '🙈', title: 'Ничего скрытого',    sub: 'Скрытые вопросы появятся здесь' },
        };
        const em = emptyMessages[state.filter] || emptyMessages.all;
        questionsList.innerHTML = `<div class="empty" style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:32px 20px;">
          <div style="font-size:28px;line-height:1;">${em.icon}</div>
          <div style="font-size:15px;font-weight:700;color:var(--text);margin-top:4px;">${em.title}</div>
          <div style="font-size:12px;color:var(--muted);">${em.sub}</div>
        </div>`;
        return;
      }

      questionsList.innerHTML = rows.map((item) => {
        const author   = [item.author_name, item.author_company].filter(Boolean).join(' · ');
        const speaker = isPanel ? '' : (state.speaker?.name || state.speaker?.fallback_label || state.room?.fallback_label || '');
        const isAsked   = item.status === 'asked';
        const isHidden  = item.status === 'hidden';
        const isPending = item.status === 'pending';
        const isPinned  = item.is_pinned;
        const voteWidth = Math.round((item.votes_count || 0) / maxVotes * 100);

        return `
          <div class="question-card ${isAsked ? 'is-asked' : ''} ${isPinned ? 'is-pinned' : ''} ${isPending ? 'is-pending' : ''}">
            <div class="question-top">
              <div class="question-main">
                <div class="question-text">${escapeHtml(item.text)}</div>
                <div class="question-meta">
                  ${speaker ? `<span class="question-meta-speaker">${escapeHtml(speaker)}</span>` : ''}${author ? `<span>${escapeHtml(author)}</span>` : ''}<span>${formatClock(item.created_at)}</span>
                </div>
                ${!isPending ? `<div class="votes-bar">
                  <div class="votes-bar-fill" style="width:${voteWidth}%;"></div>
                  <span class="votes-bar-count">+${item.votes_count || 0}</span>
                </div>` : ''}
              </div>
              <div class="question-state">
                ${isPinned ? '<span class="badge pinned">PIN</span>' : ''}
                <span class="badge ${isAsked ? 'asked' : isHidden ? 'hidden' : isPending ? 'pending' : 'open'}">
                  ${isAsked ? 'задан' : isHidden ? 'скрыт' : isPending ? 'ожидает' : 'открыт'}
                </span>
              </div>
            </div>
            <div class="question-actions">
              ${isPending ? questionActionButton(item, 'approve', 'Одобрить', 'primary') : ''}
              ${!isAsked && !isPending ? questionActionButton(item, 'ask', 'Задал', 'primary') : ''}
              ${!isHidden ? questionActionButton(item, 'hide', 'Скрыть', 'warn') : ''}
              ${isHidden || isAsked ? questionActionButton(item, 'open', 'Вернуть', 'primary') : ''}
              ${!isPending ? questionActionButton(item, 'pin', isPinned ? 'Открепить' : 'Закрепить', 'ghost') : ''}
            </div>
          </div>`;
      }).join('');

      questionsList.querySelectorAll('[data-action]').forEach((btn) => btn.addEventListener('click', async () => {
        const id = Number(btn.dataset.id);
        const action = btn.dataset.action;
        const actionKey = `${id}:${action}`;
        if (pendingQuestionActions.has(actionKey)) return;
        pendingQuestionActions.add(actionKey);
        btn.disabled = true;
        btn.setAttribute('aria-busy', 'true');
        btn.textContent = 'Сохраняю…';
        const actionRoomId = state.room?.id;
        let actionSaved = false;
        try {
          if (!actionRoomId) throw new Error('Комната не загружена.');
          if (action === 'approve') await moderateQuestionStatus(actionRoomId, id, 'open');
          if (action === 'ask')  await moderateQuestionStatus(actionRoomId, id, 'asked');
          if (action === 'hide') await moderateQuestionStatus(actionRoomId, id, 'hidden');
          if (action === 'open') await moderateQuestionStatus(actionRoomId, id, 'open');
          if (action === 'pin')  await moderateQuestionPinned(actionRoomId, id, btn.dataset.pinned !== '1');
          actionSaved = true;
        } catch (e) {
          const message = String(e?.message || '');
          if (message.includes('SESSION_NOT_CURRENT')) {
            setStatus('Сессия уже сменилась. Обновляю очередь.', 'error');
            queueRefresh();
          } else {
            setStatus(e.message || 'Не удалось выполнить действие', 'error');
          }
        }
        try {
          if (actionSaved) await refresh();
        } catch (e) {
          setStatus('Изменение сохранено, но данные не удалось обновить.', 'error');
        } finally {
          pendingQuestionActions.delete(actionKey);
          render();
        }
      }));
    }

    function questionActionButton(item, action, label, className) {
      const pending = pendingQuestionActions.has(`${item.id}:${action}`);
      const liveRoom = !state.room?.event_key || state.room?.is_current_session === true;
      const disabled = pending || !liveRoom;
      const title = liveRoom ? '' : ' title="Сессия не в эфире"';
      return `<button class="btn ${className}" data-action="${action}" data-id="${item.id}"${action === 'pin' ? ` data-pinned="${item.is_pinned ? '1' : '0'}"` : ''}${disabled ? ' disabled' : ''}${pending ? ' aria-busy="true"' : ''}${title}>${pending ? 'Сохраняю…' : label}</button>`;
    }

    function setRealtimeStatus(channelStatus) {
      const realtimeChip = document.getElementById('realtimeChip');
      const realtimeStatus = document.getElementById('realtimeStatus');
      const offline = ['CHANNEL_ERROR', 'TIMED_OUT', 'CLOSED'].includes(channelStatus);
      realtimeChip.classList.toggle('offline', offline);
      realtimeChip.classList.toggle('connecting', !offline && channelStatus !== 'SUBSCRIBED');
      realtimeStatus.textContent = channelStatus === 'SUBSCRIBED'
        ? 'Realtime подключён'
        : offline ? 'Нет связи' : 'Подключение…';
    }

    function setStatus(message, type = '') {
      statusEl.textContent = message;
      statusEl.className = `status ${type}`.trim();
    }
  </script>
</body>
</html>
