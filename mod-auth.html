<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Модератор — SANCHEZ · Live Q&A</title>
  <link rel="stylesheet" href="./theme.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap');

    .moderator-console { font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-variant-numeric: tabular-nums lining-nums; }
    .moderator-console h1, .moderator-console h2, .moderator-console .section-title { font-family: inherit; }
    .moderator-shell { max-width: 1040px; gap: 12px; }
    .moderator-live .card-inner { padding: 15px 18px; }
    .moderator-live-grid { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; }
    .moderator-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
    .moderator-brand .brand-logo-mark { width: 30px; height: 30px; border-radius: 9px; font-size: 14px; }
    .moderator-brand-label { color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .live-speaker-label { display: flex; align-items: center; gap: 7px; color: var(--green); font-size: 10px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    .live-speaker-label::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
    .moderator-live h1 { margin: 4px 0 0; color: var(--text); background: none; -webkit-text-fill-color: var(--text); font-size: clamp(21px, 3vw, 31px); font-weight: 800; letter-spacing: -.035em; line-height: 1.12; }
    .moderator-live .subcopy { margin: 4px 0 0; font-size: 12px; line-height: 1.45; }
    .live-statuses { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 7px; }
    .room-chip, .live-chip { display: inline-flex; align-items: center; min-height: 30px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--border-2); background: var(--surface-2); color: #a9c8f7; font-size: 10px; font-weight: 800; letter-spacing: .04em; white-space: nowrap; }
    .room-chip.open { background: rgba(34,211,170,.1); border-color: rgba(34,211,170,.22); color: var(--green); }
    .room-chip.closed { background: rgba(251,191,36,.1); border-color: rgba(251,191,36,.22); color: #fde68a; }
    .live-chip.warn { color: #fde68a; border-color: rgba(251,191,36,.2); }
    .live-chip .live-dot { width: 6px; height: 6px; margin-right: 6px; border-radius: 50%; background: var(--green); }

    .moderator-queue .card-inner { padding: 16px; }
    .queue-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 13px; }
    .queue-title { margin: 0; color: var(--text); font-size: 17px; font-weight: 800; letter-spacing: -.02em; }
    .queue-title span { color: #93c5fd; }
    .queue-subtitle { margin: 3px 0 0; color: var(--muted); font-size: 11px; }
    .focus-mode-btn { min-height: 38px; padding: 0 11px; border-radius: 10px; font-size: 11px; }
    .filter-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
    .filter-tab { display: grid; justify-items: start; align-content: center; min-height: 76px; padding: 10px 12px; border: 1px solid var(--border-2); border-radius: 13px; background: var(--surface-2); color: var(--muted); font-family: inherit; cursor: pointer; text-align: left; transition: border-color .15s, background .15s, transform .15s; }
    .filter-tab:hover { border-color: rgba(59,130,246,.38); background: rgba(59,130,246,.09); }
    .filter-tab:focus-visible, .focus-mode-btn:focus-visible { outline: 3px solid rgba(59,130,246,.38); outline-offset: 2px; }
    .filter-tab.active { border-color: rgba(59,130,246,.58); background: rgba(26,79,216,.22); box-shadow: inset 3px 0 0 var(--blue-light); color: #dbeafe; }
    .filter-count { color: var(--text); font-size: 27px; font-weight: 900; letter-spacing: -.065em; line-height: .95; }
    .filter-tab.active .filter-count { color: #fff; }
    .filter-label { margin-top: 7px; font-size: 10px; font-weight: 800; letter-spacing: .07em; line-height: 1.2; text-transform: uppercase; }
    .filter-tab.pending .filter-count { color: #fde68a; }
    .moderator-status { margin: 10px 1px 0; min-height: 0; }
    .question-list { margin-top: 14px; border-top: 1px solid var(--border-2); }
    .moderator-console #questionsList { display: grid; gap: 0; }
    .moderator-console .question-card { padding: 17px 2px; border: 0; border-bottom: 1px solid var(--border-2); border-radius: 0; background: transparent; }
    .moderator-console .question-card:last-child { border-bottom: 0; }
    .moderator-console .question-card.is-pinned { background: linear-gradient(90deg, rgba(26,79,216,.1), transparent 42%); }
    .moderator-console .question-card.is-asked { opacity: .62; }
    .moderator-console .question-card.is-pending { background: linear-gradient(90deg, rgba(251,191,36,.06), transparent 42%); }
    .question-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .question-main { min-width: 0; flex: 1; }
    .moderator-console .question-text { font-size: clamp(17px, 2.35vw, 19px); font-weight: 600; line-height: 1.45; letter-spacing: -.015em; }
    .moderator-console .question-meta { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 8px; font-size: 11px; line-height: 1.4; }
    .question-meta-speaker { color: #93c5fd; font-weight: 700; }
    .question-state { display: grid; justify-items: end; gap: 5px; flex: 0 0 auto; }
    .question-state .badge { padding: 4px 7px; font-size: 9px; }
    .votes-bar { display: flex; align-items: center; gap: 7px; margin-top: 9px; }
    .votes-bar-fill { min-width: 4px; height: 3px; border-radius: 999px; background: linear-gradient(90deg, var(--blue), var(--blue-light)); }
    .votes-bar-count { color: #93c5fd; font-size: 11px; font-weight: 700; }
    .moderator-console .question-actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 8px; margin-top: 14px; }
    .moderator-console .question-actions .btn { min-height: 44px; padding: 10px 12px; font-size: 11px; font-weight: 800; }
    .moderator-console .question-actions .btn.primary { box-shadow: 0 3px 14px rgba(26,79,216,.3); }
    .moderator-console .empty { margin: 18px 0 2px; }
    .focus-questions .moderator-live { display: none; }
    .focus-questions .moderator-shell { max-width: 1120px; }

    @media (max-width: 820px) { .filter-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 680px) { .app { padding: 12px 12px 28px; } .card { border-radius: 17px; } .moderator-live .card-inner, .moderator-queue .card-inner { padding: 14px; } .moderator-live-grid { grid-template-columns: 1fr; gap: 11px; } .live-statuses { justify-content: flex-start; } .filter-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .filter-tab { min-height: 74px; } .question-state { max-width: 88px; } }
    @media (max-width: 420px) { .queue-head { align-items: flex-start; flex-direction: column; } .focus-mode-btn { width: 100%; } .moderator-console .question-actions { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="moderator-console app">
    <main class="moderator-shell shell">
      <section class="card moderator-live">
        <div class="card-inner moderator-live-grid">
          <div>
            <div class="moderator-brand"><div class="brand-logo-mark">S</div><span class="moderator-brand-label">SANCHEZ · Модератор</span></div>
            <div class="live-speaker-label">Сейчас в эфире</div>
            <h1 id="speakerName">Загрузка…</h1>
            <p class="subcopy" id="speakerMeta"></p>
          </div>
          <div class="live-statuses">
            <span id="roomChip" class="room-chip closed">Загрузка…</span>
            <span id="moderationChip" class="live-chip warn">Премодерация</span>
            <span class="live-chip"><i class="live-dot"></i>Realtime</span>
          </div>
        </div>
      </section>

      <section class="card moderator-queue">
        <div class="card-inner">
          <div class="queue-head">
            <div><h2 class="queue-title">Вопросы · <span id="countLabel">0</span></h2><p class="queue-subtitle">Выберите очередь и обработайте следующий вопрос</p></div>
            <button class="btn ghost focus-mode-btn" id="focusModeBtn" type="button" aria-pressed="false">Только вопросы</button>
          </div>
          <div class="filter-grid" aria-label="Очереди вопросов">
            <button class="filter-tab active" data-filter="all"><span class="filter-count" id="sAll">0</span><span class="filter-label">Все</span></button>
            <button class="filter-tab pending" data-filter="pending"><span class="filter-count" id="sPending">0</span><span class="filter-label">На модерации</span></button>
            <button class="filter-tab" data-filter="open"><span class="filter-count" id="sOpen">0</span><span class="filter-label">Открытые</span></button>
            <button class="filter-tab" data-filter="asked"><span class="filter-count" id="sAsked">0</span><span class="filter-label">Заданные</span></button>
            <button class="filter-tab" data-filter="hidden"><span class="filter-count" id="sHidden">0</span><span class="filter-label">Скрытые</span></button>
          </div>
          <div class="status moderator-status" id="status"></div>
          <div class="question-list"><div class="list" id="questionsList"></div></div>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import {
      supabase, getRoomSlug, getRoomBySlug, getActiveSpeaker, listQuestions,
      setQuestionStatus, setQuestionPinned, approveQuestion, subscribeRoom, escapeHtml, formatClock
    } from './supabase-qna.js';

    const roomSlug = getRoomSlug();
    const roomChip     = document.getElementById('roomChip');
    const moderationChip = document.getElementById('moderationChip');
    const speakerName  = document.getElementById('speakerName');
    const speakerMeta  = document.getElementById('speakerMeta');
    const questionsList = document.getElementById('questionsList');
    const statusEl     = document.getElementById('status');
    const countLabel   = document.getElementById('countLabel');
    const filterTabs   = Array.from(document.querySelectorAll('.filter-tab'));
    const focusModeBtn = document.getElementById('focusModeBtn');
    const focusModeKey = 'sanchez-live-moderator-focus-mode';

    const state = { room: null, speaker: null, questions: [], filter: 'all' };
    let unsubscribe = null;
    let maxVotes = 1;
    let _refreshing = false;
    let _pendingRefresh = false;

    function setFocusMode(enabled) {
      document.body.classList.toggle('focus-questions', enabled);
      focusModeBtn.setAttribute('aria-pressed', String(enabled));
      focusModeBtn.textContent = enabled ? 'Показать эфир' : 'Только вопросы';
      localStorage.setItem(focusModeKey, String(enabled));
    }

    try {
      setFocusMode(localStorage.getItem(focusModeKey) === 'true');
    } catch {
      document.body.classList.remove('focus-questions');
    }

    boot();

    async function boot() {
      const { data } = await supabase.auth.getSession();
      if (!data.session) {
        location.href = `./login-auth.html?room=${encodeURIComponent(roomSlug)}`;
        return;
      }

      filterTabs.forEach((tab) => tab.addEventListener('click', () => {
        state.filter = tab.dataset.filter;
        filterTabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        render();
      }));
      focusModeBtn.addEventListener('click', () => {
        setFocusMode(!document.body.classList.contains('focus-questions'));
      });

      try {
        await refresh();
      } catch (e) {
        const isNotFound = e?.code === 'PGRST116' || String(e?.message || '').includes('JSON object requested');
        speakerName.textContent = isNotFound ? 'Комната не найдена' : 'Ошибка загрузки';
        speakerMeta.textContent = isNotFound
          ? `Комната «${roomSlug}» не существует. Проверьте параметр ?room= в ссылке.`
          : (e?.message || 'Не удалось загрузить данные. Попробуйте обновить страницу.');
        return;
      }
      if (unsubscribe) unsubscribe();
      unsubscribe = subscribeRoom(state.room.id, refresh);
    }

    async function refresh() {
      if (_refreshing) { _pendingRefresh = true; return; }
      _refreshing = true;
      _pendingRefresh = false;
      try {
        state.room      = await getRoomBySlug(roomSlug);
        state.speaker   = await getActiveSpeaker(state.room.id);
        state.questions = await listQuestions(state.room.id, state.speaker?.id, { includeHidden: true, includeAsked: true, includePending: true });
        maxVotes = Math.max(1, ...state.questions.map(q => q.votes_count || 0));
        render();
      } finally {
        _refreshing = false;
        if (_pendingRefresh) refresh();
      }
    }

    function render() {
      // Спикер
      const fallback = state.room?.fallback_label || 'Вопросы спикеру';
      speakerName.textContent = state.speaker?.name || state.speaker?.fallback_label || fallback;
      speakerMeta.textContent = [state.speaker?.regalia, state.speaker?.topic].filter(Boolean).join(' · ') || 'Активный спикер не задан';

      // Статус комнаты
      const isOpen = state.room?.is_questions_open;
      roomChip.className = `room-chip ${isOpen ? 'open' : 'closed'}`;
      roomChip.textContent = isOpen ? 'Приём открыт' : 'Приём закрыт';
      const moderationEnabled = Boolean(state.room?.moderation_enabled);
      moderationChip.className = `live-chip ${moderationEnabled ? 'warn' : ''}`.trim();
      moderationChip.textContent = moderationEnabled ? 'Премодерация · вкл' : 'Премодерация · выкл';

      // Статистика
      const all = state.questions;
      const pendingQs = all.filter(q => q.status === 'pending');
      document.getElementById('sAll').textContent    = all.length;
      document.getElementById('sPending').textContent = pendingQs.length;
      document.getElementById('sOpen').textContent   = all.filter(q => q.status === 'open').length;
      document.getElementById('sAsked').textContent  = all.filter(q => q.status === 'asked').length;
      document.getElementById('sHidden').textContent = all.filter(q => q.status === 'hidden').length;

      // Фильтрация
      const rows = state.filter === 'all'
        ? all
        : all.filter(q => q.status === state.filter);

      countLabel.textContent = rows.length;

      if (!rows.length) {
        const emptyMessages = {
          all:     { icon: '💬', title: 'Вопросов ещё нет',   sub: 'Сессия только начинается' },
          open:    { icon: '📋', title: 'Открытых нет',       sub: 'Все вопросы уже обработаны' },
          pending: { icon: '✓',  title: 'Всё проверено',      sub: 'Нет вопросов на модерации' },
          asked:   { icon: '🎤', title: 'Ещё не спросили',    sub: 'Помечайте заданные вопросы' },
          hidden:  { icon: '🙈', title: 'Ничего скрытого',    sub: 'Скрытые вопросы появятся здесь' },
        };
        const em = emptyMessages[state.filter] || emptyMessages.all;
        questionsList.innerHTML = `<div class="empty" style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:32px 20px;">
          <div style="font-size:28px;line-height:1;">${em.icon}</div>
          <div style="font-size:15px;font-weight:700;color:var(--text);margin-top:4px;">${em.title}</div>
          <div style="font-size:12px;color:var(--muted);">${em.sub}</div>
        </div>`;
        return;
      }

      questionsList.innerHTML = rows.map((item) => {
        const author   = [item.author_name, item.author_company].filter(Boolean).join(' · ');
        const speaker = state.speaker?.name || state.speaker?.fallback_label || state.room?.fallback_label || '';
        const isAsked   = item.status === 'asked';
        const isHidden  = item.status === 'hidden';
        const isPending = item.status === 'pending';
        const isPinned  = item.is_pinned;
        const voteWidth = Math.round((item.votes_count || 0) / maxVotes * 100);

        return `
          <div class="question-card ${isAsked ? 'is-asked' : ''} ${isPinned ? 'is-pinned' : ''} ${isPending ? 'is-pending' : ''}">
            <div class="question-top">
              <div class="question-main">
                <div class="question-text">${escapeHtml(item.text)}</div>
                <div class="question-meta">
                  ${speaker ? `<span class="question-meta-speaker">${escapeHtml(speaker)}</span>` : ''}${author ? `<span>${escapeHtml(author)}</span>` : ''}<span>${formatClock(item.created_at)}</span>
                </div>
                ${!isPending ? `<div class="votes-bar">
                  <div class="votes-bar-fill" style="width:${voteWidth}%;"></div>
                  <span class="votes-bar-count">+${item.votes_count || 0}</span>
                </div>` : ''}
              </div>
              <div class="question-state">
                ${isPinned ? '<span class="badge pinned">PIN</span>' : ''}
                <span class="badge ${isAsked ? 'asked' : isHidden ? 'hidden' : isPending ? 'pending' : 'open'}">
                  ${isAsked ? 'задан' : isHidden ? 'скрыт' : isPending ? 'ожидает' : 'открыт'}
                </span>
              </div>
            </div>
            <div class="question-actions">
              ${isPending ? `<button class="btn primary" data-action="approve" data-id="${item.id}">✓ Одобрить</button>` : ''}
              ${!isAsked && !isPending ? `<button class="btn primary" data-action="ask"  data-id="${item.id}">✓ Задал</button>` : ''}
              ${!isHidden ? `<button class="btn warn" data-action="hide" data-id="${item.id}">Скрыть</button>` : ''}
              ${isHidden || isAsked ? `<button class="btn primary" data-action="open" data-id="${item.id}">Вернуть</button>` : ''}
              ${!isPending ? `<button class="btn ghost" data-action="pin" data-id="${item.id}" data-pinned="${isPinned ? '1' : '0'}">${isPinned ? 'Открепить' : 'Закрепить'}</button>` : ''}
            </div>
          </div>`;
      }).join('');

      questionsList.querySelectorAll('[data-action]').forEach((btn) => btn.addEventListener('click', async () => {
        try {
          const id = Number(btn.dataset.id);
          const action = btn.dataset.action;
          if (action === 'approve') await approveQuestion(id);
          if (action === 'ask')  await setQuestionStatus(id, 'asked');
          if (action === 'hide') await setQuestionStatus(id, 'hidden');
          if (action === 'open') await setQuestionStatus(id, 'open');
          if (action === 'pin')  await setQuestionPinned(id, btn.dataset.pinned !== '1');
          await refresh();
        } catch (e) {
          setStatus(e.message || 'Не удалось выполнить действие', 'error');
        }
      }));
    }

    function setStatus(message, type = '') {
      statusEl.textContent = message;
      statusEl.className = `status ${type}`.trim();
    }
  </script>
</body>
</html>
