<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Модератор — Altera Q&A</title>
  <link rel="stylesheet" href="./theme.css" />
  <style>
    /* Сортировка по голосам — визуальный индикатор */
    .votes-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }
    .votes-bar-fill {
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--blue), var(--blue-light));
      transition: width 0.4s ease;
      min-width: 4px;
    }
    .votes-bar-count {
      font-size: 12px;
      font-weight: 700;
      color: #93c5fd;
      white-space: nowrap;
    }

    /* Уже заданный вопрос — приглушён */
    .question-card.is-asked {
      opacity: 0.55;
      border-color: rgba(34,211,170,0.12);
    }
    .question-card.is-pinned {
      border-color: rgba(59,130,246,0.35);
      background: rgba(26,79,216,0.08);
    }

    /* Фильтр-таб активный */
    .filter-tab {
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-2);
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-tab:hover { background: rgba(255,255,255,0.06); color: var(--text); }
    .filter-tab.active {
      background: rgba(26,79,216,0.2);
      border-color: rgba(59,130,246,0.4);
      color: #93c5fd;
    }

    /* Комнатный статус-чип */
    .room-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }
    .room-chip.open   { background: rgba(34,211,170,0.1); color: var(--green); border: 1px solid rgba(34,211,170,0.2); }
    .room-chip.closed { background: rgba(251,191,36,0.1); color: #fde68a; border: 1px solid rgba(251,191,36,0.2); }

    /* Счётчики вверху */
    .stats-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .mini-stat {
      flex: 1;
      min-width: 70px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      background: var(--surface-2);
      border: 1px solid var(--border-2);
      text-align: center;
    }
    .mini-stat-val  { font-size: 22px; font-weight: 900; color: #fff; letter-spacing: -0.04em; line-height: 1; }
    .mini-stat-lbl  { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
  </style>
</head>
<body>
  <div class="app">
    <main class="shell">

      <!-- Шапка -->
      <section class="card">
        <div class="card-inner hero-grid">
          <div>
            <div class="altera-logo">
              <div class="altera-logo-mark">A</div>
              <span class="altera-logo-text">Altera · Модератор</span>
            </div>
            <h1 id="speakerName" style="font-size:clamp(20px,3vw,36px);">Загрузка…</h1>
            <p class="subcopy" id="speakerMeta" style="margin-top:6px;"></p>
          </div>
          <div class="links-grid">
            <div id="roomChip" class="room-chip closed">⏸ Загрузка…</div>
            <button class="btn danger" id="logoutBtn" style="width:100%;">Выйти</button>
          </div>
        </div>
      </section>

      <!-- Статистика + фильтры -->
      <section class="card">
        <div class="card-inner" style="display:grid; gap:14px;">
          <div class="stats-row" id="statsRow">
            <div class="mini-stat"><div class="mini-stat-val" id="sAll">0</div><div class="mini-stat-lbl">Всего</div></div>
            <div class="mini-stat"><div class="mini-stat-val" id="sOpen">0</div><div class="mini-stat-lbl">Открыты</div></div>
            <div class="mini-stat"><div class="mini-stat-val" id="sAsked">0</div><div class="mini-stat-lbl">Заданы</div></div>
            <div class="mini-stat"><div class="mini-stat-val" id="sHidden">0</div><div class="mini-stat-lbl">Скрыты</div></div>
          </div>
          <div class="row" style="gap:8px;">
            <button class="filter-tab active" data-filter="all">Все</button>
            <button class="filter-tab" data-filter="open">Открытые</button>
            <button class="filter-tab" data-filter="asked">Заданные</button>
            <button class="filter-tab" data-filter="hidden">Скрытые</button>
          </div>
          <div class="status" id="status"></div>
        </div>
      </section>

      <!-- Лента вопросов -->
      <section class="card">
        <div class="card-inner">
          <h2 class="section-title">Вопросы · <span id="countLabel">0</span></h2>
          <div class="list" id="questionsList"></div>
        </div>
      </section>

    </main>
  </div>

  <script type="module">
    import {
      supabase, getRoomSlug, getRoomBySlug, getActiveSpeaker, listQuestions,
      setQuestionStatus, setQuestionPinned, subscribeRoom, escapeHtml, formatClock
    } from './supabase-qna.js';

    const roomSlug = getRoomSlug();
    const roomChip     = document.getElementById('roomChip');
    const speakerName  = document.getElementById('speakerName');
    const speakerMeta  = document.getElementById('speakerMeta');
    const questionsList = document.getElementById('questionsList');
    const statusEl     = document.getElementById('status');
    const countLabel   = document.getElementById('countLabel');
    const filterTabs   = Array.from(document.querySelectorAll('.filter-tab'));

    const state = { room: null, speaker: null, questions: [], filter: 'all' };
    let unsubscribe = null;
    let maxVotes = 1;

    boot();

    async function boot() {
      const { data } = await supabase.auth.getSession();
      if (!data.session) {
        location.href = `./login-auth.html?room=${encodeURIComponent(roomSlug)}`;
        return;
      }

      filterTabs.forEach((tab) => tab.addEventListener('click', () => {
        state.filter = tab.dataset.filter;
        filterTabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        render();
      }));
      document.getElementById('logoutBtn').addEventListener('click', logout);

      await refresh();
      if (unsubscribe) unsubscribe();
      unsubscribe = subscribeRoom(state.room.id, refresh);
    }

    async function refresh() {
      state.room     = await getRoomBySlug(roomSlug);
      state.speaker  = await getActiveSpeaker(state.room.id);
      state.questions = await listQuestions(state.room.id, state.speaker?.id, { includeHidden: true, includeAsked: true });
      maxVotes = Math.max(1, ...state.questions.map(q => q.votes_count || 0));
      render();
    }

    function render() {
      // Спикер
      const fallback = state.room?.fallback_label || 'Вопросы спикеру';
      speakerName.textContent = state.speaker?.name || state.speaker?.fallback_label || fallback;
      speakerMeta.textContent = [state.speaker?.regalia, state.speaker?.topic].filter(Boolean).join(' · ') || 'Активный спикер не задан';

      // Статус комнаты
      const isOpen = state.room?.is_questions_open;
      roomChip.className = `room-chip ${isOpen ? 'open' : 'closed'}`;
      roomChip.textContent = isOpen ? '● Приём открыт' : '⏸ Приём закрыт';

      // Статистика
      const all = state.questions;
      document.getElementById('sAll').textContent    = all.length;
      document.getElementById('sOpen').textContent   = all.filter(q => q.status === 'open').length;
      document.getElementById('sAsked').textContent  = all.filter(q => q.status === 'asked').length;
      document.getElementById('sHidden').textContent = all.filter(q => q.status === 'hidden').length;

      // Фильтрация
      const rows = state.filter === 'all'
        ? all
        : all.filter(q => q.status === state.filter);

      countLabel.textContent = rows.length;

      if (!rows.length) {
        questionsList.innerHTML = '<div class="empty">По выбранному фильтру вопросов нет.</div>';
        return;
      }

      questionsList.innerHTML = rows.map((item) => {
        const author   = [item.author_name, item.author_company].filter(Boolean).join(' · ');
        const isAsked  = item.status === 'asked';
        const isHidden = item.status === 'hidden';
        const isPinned = item.is_pinned;
        const voteWidth = Math.round((item.votes_count || 0) / maxVotes * 100);

        return `
          <div class="question-card ${isAsked ? 'is-asked' : ''} ${isPinned ? 'is-pinned' : ''}">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px;">
              <div style="flex:1; min-width:0;">
                <div class="question-text">${escapeHtml(item.text)}</div>
                <div class="question-meta" style="margin-top:6px;">
                  ${author ? escapeHtml(author) + ' · ' : ''}${formatClock(item.created_at)}
                </div>
                <div class="votes-bar">
                  <div class="votes-bar-fill" style="width:${voteWidth}%;"></div>
                  <span class="votes-bar-count">+${item.votes_count || 0}</span>
                </div>
              </div>
              <div style="display:flex; flex-direction:column; gap:6px; align-items:flex-end; flex-shrink:0;">
                ${isPinned ? '<span class="badge pinned">PIN</span>' : ''}
                <span class="badge ${isAsked ? 'asked' : isHidden ? 'hidden' : 'open'}">${isAsked ? 'задан' : isHidden ? 'скрыт' : 'открыт'}</span>
              </div>
            </div>
            <div class="question-actions" style="margin-top:14px;">
              ${!isAsked  ? `<button class="btn primary" style="padding:9px 14px; font-size:12px;" data-action="ask"  data-id="${item.id}">✓ Задал</button>` : ''}
              ${!isHidden ? `<button class="btn warn"    style="padding:9px 14px; font-size:12px;" data-action="hide" data-id="${item.id}">Скрыть</button>` : ''}
              ${isHidden || isAsked ? `<button class="btn ghost" style="padding:9px 14px; font-size:12px;" data-action="open" data-id="${item.id}">Вернуть</button>` : ''}
              <button class="btn ghost" style="padding:9px 14px; font-size:12px;" data-action="pin" data-id="${item.id}" data-pinned="${isPinned ? '1' : '0'}">
                ${isPinned ? '⬆ Открепить' : '📌 Закрепить'}
              </button>
            </div>
          </div>`;
      }).join('');

      questionsList.querySelectorAll('[data-action]').forEach((btn) => btn.addEventListener('click', async () => {
        try {
          const id = Number(btn.dataset.id);
          const action = btn.dataset.action;
          if (action === 'ask')  await setQuestionStatus(id, 'asked');
          if (action === 'hide') await setQuestionStatus(id, 'hidden');
          if (action === 'open') await setQuestionStatus(id, 'open');
          if (action === 'pin')  await setQuestionPinned(id, btn.dataset.pinned !== '1');
          await refresh();
        } catch (e) {
          setStatus(e.message || 'Не удалось выполнить действие', 'error');
        }
      }));
    }

    async function logout() {
      await supabase.auth.signOut();
      location.href = `./login-auth.html?room=${encodeURIComponent(roomSlug)}`;
    }

    function setStatus(message, type = '') {
      statusEl.textContent = message;
      statusEl.className = `status ${type}`.trim();
    }
  </script>
</body>
</html>
