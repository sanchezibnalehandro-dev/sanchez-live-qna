<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title></title>
  <link rel="stylesheet" href="./theme.css" />
  <link rel="stylesheet" data-brand-stylesheet href="./brands/sanchez.css" />
  <style>
    .program-page { padding: max(16px, env(safe-area-inset-top)) 14px max(34px, env(safe-area-inset-bottom)); }
    .program-shell { width: min(880px, 100%); margin: 0 auto; display: grid; gap: 12px; }
    .program-top { padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .program-brand { min-width: 0; display: flex; align-items: center; gap: 10px; }
    .program-brand .brand-logo-mark { width: 34px; height: 34px; border-radius: 10px; }
    .program-brand-copy { min-width: 0; display: grid; gap: 1px; }
    .program-brand-copy strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 800; }
    .program-brand-copy span { color: var(--color-text-secondary); font-size: 9px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    .program-nav { display: flex; gap: 7px; flex: 0 0 auto; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .realtime-pill {
      min-height: 28px; display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px;
      border: 1px solid var(--color-border); border-radius: 999px; background: var(--color-surface-subtle);
      color: var(--color-text-secondary); font-size: 9px; font-weight: 800; white-space: nowrap;
    }
    .realtime-pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .realtime-pill[data-state="connected"] { color: var(--color-success-text); }
    .realtime-pill[data-state="offline"] { color: var(--color-danger-text); }
    .program-nav a {
      min-height: 36px; display: inline-flex; align-items: center; justify-content: center; padding: 7px 11px;
      border: 1px solid var(--color-border); border-radius: 10px; background: var(--color-surface-subtle);
      color: var(--color-text); text-decoration: none; font-size: 10px; font-weight: 800;
    }
    .program-hero { padding: clamp(22px, 5vw, 36px); }
    .program-kicker { color: var(--color-accent-text); font-size: 9px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    .program-title { margin: 7px 0 6px; color: var(--color-text); font-family: var(--font-display); font-size: clamp(30px, 6vw, 48px); line-height: 1.05; letter-spacing: -.035em; }
    .program-date { color: var(--color-text-secondary); font-size: 12px; }
    .program-list { display: grid; gap: 8px; }
    .program-item {
      display: grid; grid-template-columns: 112px minmax(0,1fr); gap: 16px; padding: 18px 20px;
      border: 1px solid var(--color-border); border-radius: var(--radius-xl);
      background: var(--color-surface-raised); box-shadow: var(--shadow-card);
    }
    .program-time { display: grid; align-content: start; gap: 3px; padding-top: 2px; }
    .program-time strong { color: var(--color-text); font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .program-time span { color: var(--color-text-secondary); font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
    .program-content { min-width: 0; display: grid; gap: 7px; }
    .program-flags { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; }
    .program-flag {
      display: inline-flex; padding: 3px 7px; border-radius: 999px; background: var(--color-neutral-soft);
      color: var(--color-neutral-text); font-size: 8px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
    }
    .program-flag.current { background: var(--color-success-soft); color: var(--color-success-text); }
    .program-name { color: var(--color-text); font-size: 16px; font-weight: 800; line-height: 1.35; }
    .program-meta { color: var(--color-text-secondary); font-size: 11px; line-height: 1.5; }
    .program-empty { padding: 30px 22px; color: var(--color-text-secondary); text-align: center; }
    @media (max-width: 620px) {
      .program-top { align-items: flex-start; flex-direction: column; }
      .program-nav { width: 100%; }
      .program-nav a { flex: 1; }
      .program-item { grid-template-columns: 1fr; gap: 8px; padding: 16px; }
      .program-time { grid-template-columns: auto auto; justify-content: start; align-items: baseline; gap: 8px; }
    }
  </style>
</head>
<body class="is-booting">
  <div class="bootstrap-screen" id="bootstrapScreen" role="status" aria-live="polite">
    <div class="bootstrap-card">
      <div class="bootstrap-brand"><div class="brand-logo-mark" data-brand-mark></div><div class="bootstrap-brand-copy"><strong data-brand-name></strong><span data-brand-product></span></div></div>
      <p class="bootstrap-message" id="bootstrapMessage">Загрузка программы…</p>
    </div>
  </div>

  <main class="program-page app" id="appShell" inert aria-hidden="true">
    <div class="program-shell">
      <section class="card program-top">
        <div class="program-brand">
          <div class="brand-logo-mark" data-brand-mark></div>
          <div class="program-brand-copy"><strong data-brand-name></strong><span data-brand-product></span></div>
        </div>
        <nav class="program-nav" aria-label="Разделы мероприятия">
          <span class="realtime-pill" id="realtimeStatus" data-state="connecting">Подключение…</span>
          <a id="homeLink" href="#">Главная</a>
          <a id="askLink" href="#">Задать вопрос</a>
        </nav>
      </section>

      <section class="card program-hero">
        <div class="program-kicker">EVENT PROGRAM</div>
        <h1 class="program-title">Программа дня</h1>
        <div class="program-date" id="programDate">Актуальное расписание мероприятия</div>
      </section>

      <section class="program-list" id="programList"></section>
    </div>
  </main>

  <script type="module">
    import { applyBrandIdentity, getBrandForRoute } from './brand.js';
    import { getEventKey, listEventRooms, listSpeakers, subscribeEvent, escapeHtml } from './supabase-qna.js';

    const eventKey = getEventKey();
    const brand = getBrandForRoute(null, eventKey);
    applyBrandIdentity('program', brand);

    const appShell = document.getElementById('appShell');
    const bootstrapScreen = document.getElementById('bootstrapScreen');
    const bootstrapMessage = document.getElementById('bootstrapMessage');
    const programList = document.getElementById('programList');
    const programDate = document.getElementById('programDate');
    const homeLink = document.getElementById('homeLink');
    const askLink = document.getElementById('askLink');
    const realtimeStatus = document.getElementById('realtimeStatus');

    let unsubscribeEvent = null;
    let disposed = false;
    let refreshing = false;
    let refreshPending = false;
    let hasRendered = false;

    function finishBootstrap() {
      appShell.removeAttribute('inert');
      appShell.removeAttribute('aria-hidden');
      document.body.classList.remove('is-booting');
      document.body.classList.add('is-ready');
    }

    function showError(message) {
      bootstrapScreen.classList.add('is-error');
      bootstrapScreen.setAttribute('role', 'alert');
      bootstrapMessage.textContent = message;
    }

    function setRealtimeStatus(status) {
      if (disposed) return;
      const offline = ['CHANNEL_ERROR', 'TIMED_OUT', 'CLOSED'].includes(status);
      realtimeStatus.dataset.state = status === 'SUBSCRIBED' ? 'connected' : offline ? 'offline' : 'connecting';
      realtimeStatus.textContent = status === 'SUBSCRIBED'
        ? 'Realtime'
        : offline ? 'Нет связи' : 'Подключение…';
    }

    function reportRefreshError(error) {
      console.error('Event program refresh failed', error);
      if (!hasRendered) {
        showError(error?.code === 'EVENT_NOT_FOUND'
          ? 'Мероприятие не найдено. Проверьте QR-код или ссылку.'
          : 'Не удалось загрузить программу. Обновите страницу и попробуйте снова.');
        return;
      }
      realtimeStatus.dataset.state = 'offline';
      realtimeStatus.textContent = 'Ошибка обновления';
    }

    function queueRefresh() {
      void refresh().catch(reportRefreshError);
    }

    function formatTime(value) {
      if (!value) return null;
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return null;
      return date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    }

    function formatRange(room) {
      const start = formatTime(room.starts_at);
      if (!start) return { range: '—', note: 'Время уточняется' };
      const duration = Number(room.duration_minutes);
      if (!Number.isFinite(duration) || duration <= 0) return { range: start, note: 'Начало' };
      const end = new Date(new Date(room.starts_at).getTime() + duration * 60000);
      return { range: `${start}–${formatTime(end.toISOString())}`, note: `${duration} мин` };
    }

    function formatDate(value) {
      if (!value) return null;
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return null;
      return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    function speakerMeta(room, speakers) {
      if (room.mode === 'panel') {
        const names = speakers.map(item => item.name).filter(Boolean);
        const participantText = names.length
          ? `Участники: ${names.slice(0, 4).join(', ')}${names.length > 4 ? ` · +${names.length - 4}` : ''}`
          : '';
        const moderatorText = room.moderator_name ? `Модератор: ${room.moderator_name}` : '';
        return [moderatorText, participantText].filter(Boolean).join(' · ');
      }

      const speaker = speakers[0];
      if (!speaker) return '';
      return [speaker.name, speaker.regalia, speaker.topic].filter(Boolean).join(' · ');
    }

    function render(rooms) {
      const firstScheduled = rooms.find(room => room.starts_at);
      const dateLabel = formatDate(firstScheduled?.starts_at);
      programDate.textContent = dateLabel || 'Актуальное расписание мероприятия';

      programList.innerHTML = rooms.map(room => {
        const timing = formatRange(room);
        const type = room.mode === 'panel' ? 'Панель' : 'Выступление';
        const meta = speakerMeta(room, room.speakers || []);
        return `
          <article class="program-item">
            <div class="program-time">
              <strong>${escapeHtml(timing.range)}</strong>
              <span>${escapeHtml(timing.note)}</span>
            </div>
            <div class="program-content">
              <div class="program-flags">
                <span class="program-flag">${type}</span>
                ${room.is_current_session ? '<span class="program-flag current">Сейчас</span>' : ''}
              </div>
              <div class="program-name">${escapeHtml(room.title || 'Без названия')}</div>
              ${meta ? `<div class="program-meta">${escapeHtml(meta)}</div>` : ''}
            </div>
          </article>`;
      }).join('') || '<div class="card program-empty">Программа пока не опубликована.</div>';
    }

    async function refresh() {
      if (disposed) return;
      if (refreshing) {
        refreshPending = true;
        return;
      }

      refreshing = true;
      refreshPending = false;
      try {
        const rooms = await listEventRooms(eventKey);
        if (disposed) return;
        if (!rooms.length) {
          const error = new Error('Event not found');
          error.code = 'EVENT_NOT_FOUND';
          throw error;
        }

        const speakersByRoom = await Promise.all(
          rooms.map(room => listSpeakers(room.id).catch(error => {
            console.error('Program speakers failed to load', room.id, error);
            return [];
          }))
        );
        if (disposed) return;

        render(rooms.map((room, index) => ({ ...room, speakers: speakersByRoom[index] })));
        if (!hasRendered) {
          hasRendered = true;
          finishBootstrap();
        }
      } finally {
        refreshing = false;
        if (!disposed && refreshPending) {
          refreshPending = false;
          queueRefresh();
        }
      }
    }

    async function init() {
      if (!eventKey) {
        showError('В ссылке не указано мероприятие.');
        return;
      }

      const route = encodeURIComponent(eventKey);
      homeLink.href = `./welcome.html?event=${route}`;
      askLink.href = `./ask.html?event=${route}`;

      unsubscribeEvent = subscribeEvent(eventKey, queueRefresh, setRealtimeStatus);

      try {
        await refresh();
      } catch (error) {
        reportRefreshError(error);
      }
    }

    window.addEventListener('pagehide', () => {
      disposed = true;
      unsubscribeEvent?.();
      unsubscribeEvent = null;
    }, { once: true });

    init();
  </script>
</body>
</html>
